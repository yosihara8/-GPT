name: SagaMap CI

on:
  push:
    paths: ["sagamap/**", ".github/workflows/sagamap-ci.yml"]
  pull_request:
    paths: ["sagamap/**", ".github/workflows/sagamap-ci.yml"]

defaults:
  run:
    working-directory: sagamap

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sagamap/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: sagamap
          POSTGRES_PASSWORD: sagamap
          POSTGRES_DB: sagamap
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sagamap" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://sagamap:sagamap@localhost:5432/sagamap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sagamap/package-lock.json
      - run: npm ci
      - name: Migrate with demo data, then again in production mode (must be idempotent)
        run: |
          SEED_DEMO_DATA=true node scripts/migrate.mjs
          node scripts/migrate.mjs
          node scripts/migrate.mjs
