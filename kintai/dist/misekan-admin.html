<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ミセカン 管理者ページ</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Cormorant+Garamond:wght@500;600&display=swap">
<style>
/* ミセカン：デパ地下の高級化粧品カウンターのような、真珠色の地に光るローズピンクとシャンパンゴールド
   レイアウト：管理者ページ＝左に縦メニュー＋右に作業面／従業員ページ＝スマホ1列＋下にタブ */
:root{
  color-scheme: light;
  --pearl:#fffafc;      /* 地の色（真珠） */
  --surface:#ffffff;
  --blush:#fbeef3;      /* うすいピンクの面 */
  --petal:#f6d8e3;
  --rose:#c8336f;       /* ミセカン・ピンク（白文字が読める濃さ） */
  --rose-hi:#ec6f9d;
  --berry:#7e1846;
  --ink:#2b1520;        /* 文字 */
  --muted:#7a5867;
  --line:#efd5df;
  --gold:#b38a4f; --gold-ink:#8a6630; --gold-hi:#e8cf9f; --gold-soft:#f6ecdb;
  --good:#2c7a57; --good-soft:#e2f2e9; --warn:#9c5c10; --warn-soft:#fbefda; --bad:#b0243d; --bad-soft:#fde4e9;
  --sat:#3657a8; --sun:#c0263f; --today:#fff4e2; --series:#c8336f;
  --shine:linear-gradient(120deg,#c8336f 0%,#cc3a76 30%,#a8245a 62%,#c8336f 100%);  /* 白い文字が読める濃さのピンクだけで作る */
  --gilt:linear-gradient(120deg,#9c7440 0%,#e8cf9f 45%,#b38a4f 70%,#f3e2bf 100%);
  --shadow:0 1px 2px rgba(126,24,70,.06),0 10px 30px -12px rgba(126,24,70,.22);
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  --f-num:"Cormorant Garamond","Shippori Mincho B1",serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--pearl);color:var(--ink);font:15px/1.7 var(--f-body);-webkit-text-size-adjust:100%;
  background-image:radial-gradient(1200px 500px at 85% -10%,#fde3ee 0%,transparent 60%),radial-gradient(900px 500px at -10% 110%,#fbeadd 0%,transparent 60%);background-attachment:fixed}
/* きらめき（光の粒）。動きを減らす設定の人には止める */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;
  background-image:radial-gradient(1.4px 1.4px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1.2px 1.2px at 78% 12%,#ffe6f0 50%,transparent 51%),radial-gradient(1.6px 1.6px at 64% 72%,#fff 50%,transparent 51%),radial-gradient(1.1px 1.1px at 28% 84%,#f7dcae 50%,transparent 51%),radial-gradient(1.3px 1.3px at 90% 58%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 42% 40%,#f7dcae 50%,transparent 51%);
  animation:twinkle 6s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.25}to{opacity:.7}}
@media (prefers-reduced-motion:reduce){body::after{animation:none}*{transition:none!important;animation:none!important}}
body > *{position:relative;z-index:1}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;color:var(--ink)}
h1{font-size:26px;letter-spacing:.06em} h2{font-size:17px;margin-bottom:12px;letter-spacing:.04em} h3{font-size:15px}
a{color:var(--rose)}
.num,.mono{font-variant-numeric:tabular-nums lining-nums}
.muted{color:var(--muted)} .small{font-size:12.5px} .center{text-align:center} .r{text-align:right} .nowrap{white-space:nowrap}
.sat{color:var(--sat)} .sun{color:var(--sun)}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}

/* ---------- 上部バー（夜のブティックのような濃い色に金のきらめき） ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--ink)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  background:linear-gradient(100deg,#2b1520 0%,#45192f 55%,#2b1520 100%);color:#fff;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px solid transparent;border-image:var(--gilt) 1}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-text{display:flex;flex-direction:column;line-height:1.1}
.brand-text b{font-family:var(--f-display);font-size:19px;letter-spacing:.3em;font-weight:700;background:var(--gilt);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-text small{font-size:10.5px;letter-spacing:.3em;color:#f3d6e2}
.logo{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--gilt);color:#3a1a28;font:700 15px var(--f-display);box-shadow:0 0 0 1px rgba(255,255,255,.4) inset,0 0 14px rgba(232,207,159,.45);flex:none}
.logo.big{width:64px;height:64px;font-size:28px}
.store{font-size:12.5px;color:#f3d6e2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:1px solid rgba(232,207,159,.4);padding-left:10px}
.top-r{display:flex;gap:6px;align-items:center}
.top-link{font:inherit;font-size:13px;color:#fff;text-decoration:none;padding:6px 14px;border-radius:999px;border:1px solid rgba(232,207,159,.55);background:transparent;cursor:pointer}
.top-link:hover{background:rgba(232,207,159,.15)}
.proto-note{font-size:12px;color:var(--berry);background:linear-gradient(90deg,var(--blush),var(--gold-soft));padding-block:5px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}

/* ---------- 管理者ページ ---------- */
.gate{min-height:70vh;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gate-card{width:min(380px,100%);display:flex;flex-direction:column;gap:12px;align-items:stretch;text-align:center;background:var(--surface);border-radius:20px;padding:32px 24px;box-shadow:var(--shadow);border:1px solid var(--line)}
.gate-card .logo{align-self:center}
.gate-card .field{text-align:left}
.admin{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;max-width:1400px;margin:0 auto;padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{position:sticky;top:84px;align-self:start;display:flex;flex-direction:column;gap:16px;background:rgba(255,255,255,.7);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:18px;padding:14px 10px}
.nav-title{font-size:10.5px;letter-spacing:.28em;color:var(--gold-ink);margin:0 0 4px 12px;font-weight:700}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 12px;border-radius:999px;color:var(--ink);text-decoration:none;font-size:14.5px}
.nav-item:hover{background:var(--blush)}
.nav-item.on{background:var(--shine);background-size:160% 100%;color:#fff;font-weight:700;box-shadow:0 6px 16px -8px rgba(200,51,111,.7)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--berry);color:#fff;font-size:11.5px;font-weight:700;display:inline-grid;place-items:center;box-shadow:0 0 0 2px #fff}
.nav-item.on .badge{background:#fff;color:var(--rose);box-shadow:none}
.admin-main{min-width:0;display:flex;flex-direction:column;gap:18px}
.page-head{display:flex;flex-direction:column;gap:4px;padding-bottom:10px;border-bottom:1px solid transparent;border-image:linear-gradient(90deg,var(--gold-hi),transparent 70%) 1}
.lead{margin:0;color:var(--muted);font-size:14px;max-width:75ch}
@media (max-width:900px){
  .admin{grid-template-columns:minmax(0,1fr);gap:14px;padding-top:14px}
  .side{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding:6px;border-radius:999px;scrollbar-width:thin}
  .nav-group{flex-direction:row;gap:2px}
  .nav-title{display:none}
  .nav-item{white-space:nowrap}
  .store{display:none}
}

/* ---------- 部品 ---------- */
.card,.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0;box-shadow:var(--shadow)}
.card > p:first-child{margin-top:0}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.card-head h2{margin:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--gilt)}
.tile-label{font-size:12px;color:var(--muted);letter-spacing:.06em}
.tile-num{font-family:var(--f-num);font-size:32px;font-weight:600;line-height:1.2;color:var(--berry);font-variant-numeric:lining-nums tabular-nums}
.tile-num.small-num{font-family:var(--f-display);font-size:18px;padding:6px 0}
.tile-num small{font-size:14px;color:var(--muted);font-family:var(--f-body);font-weight:400}
.tile-sub{font-size:12.5px;color:var(--muted)}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.toolbar-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row-end{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:10px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper-label{font-family:var(--f-display);font-size:17px;min-width:9em;text-align:center}
.btn{font:inherit;font-size:14px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.btn:hover{border-color:var(--rose-hi);color:var(--rose)}
.btn.sm{padding:5px 12px;font-size:13px}
.btn.primary{background:var(--shine);background-size:180% 100%;background-position:30% 0;border-color:transparent;color:#fff;font-weight:700;box-shadow:0 8px 18px -10px rgba(200,51,111,.9);transition:background-position .5s}
.btn.primary:hover{background-position:90% 0;color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.btn.danger{color:var(--bad);border-color:#f2c3cd}
.btn.ghost{background:transparent;border-color:transparent;color:inherit}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.block{width:100%}
.btn.big{font-size:18px;padding:16px 0;flex:1;border-radius:18px}
.link{background:none;border:0;font:inherit;font-weight:700;cursor:pointer;color:inherit;padding:0;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--gold-hi)}
input,select,textarea{font:inherit;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);min-width:0;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--rose-hi);outline:none;box-shadow:0 0 0 3px #fbd3e2}
textarea{width:100%;resize:vertical}
textarea.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
input[type=number]{width:7em}
input[type=color]{padding:2px;height:40px;width:64px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px;align-items:end}
.form.one{grid-template-columns:minmax(0,1fr)}
.form .wide{grid-column:1/-1}
.form-sec{font-size:14px;color:var(--berry);padding-top:8px;border-top:1px dashed var(--line);margin-top:4px;letter-spacing:.06em}
.inline-form{grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr))}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.field input,.field select{width:100%}
.law-tag{display:inline-block;font-size:10px;padding:0 6px;border-radius:999px;background:var(--gold-soft);color:var(--gold-ink);font-weight:700;letter-spacing:.05em}
.req{font-size:10px;color:var(--bad);font-weight:700}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{accent-color:var(--rose)}
.inline{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.inline input[type=number]{width:4.5em}
.err{color:var(--bad);font-size:13px;margin:0;min-height:1em}
.notice{background:linear-gradient(90deg,var(--gold-soft),#fff8ee);color:var(--ink);border:1px solid #ecd9b6;border-left:4px solid var(--gold);padding:9px 14px;border-radius:12px;font-size:13px;margin:0}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:999px;font-size:12px;background:var(--blush);color:var(--berry);white-space:nowrap;text-decoration:none}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.info{background:var(--blush);color:var(--berry)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip-btn{font:inherit;font-size:13px;padding:4px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.chip-btn:hover{border-color:var(--rose-hi);color:var(--rose);background:var(--blush)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px;box-shadow:0 0 0 2px #fff,0 0 0 3px var(--line)}
.seg{display:inline-flex;background:var(--blush);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap;border:1px solid var(--line)}
.admin-main > .seg{align-self:flex-start}
.seg button{font:inherit;font-size:13.5px;border:0;background:transparent;color:var(--muted);padding:6px 16px;border-radius:999px;cursor:pointer}
.seg button[aria-selected="true"]{background:#fff;color:var(--rose);font-weight:700;box-shadow:0 2px 8px -2px rgba(126,24,70,.25)}
.seg.full{display:flex} .seg.full button{flex:1}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font:inherit;font-size:13px;padding:5px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.pill.on{background:var(--shine);border-color:transparent;color:#fff;font-weight:700}
.meter{display:inline-block;width:90px;height:6px;border-radius:3px;background:var(--blush);overflow:hidden;vertical-align:middle;margin:0 8px}
.meter i{display:block;height:100%;background:var(--shine);border-radius:3px}
ul.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
ul.plain li{display:flex;align-items:center;gap:4px;justify-content:space-between}
ul.plain li a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- 法令チェック ---------- */
.issues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.issue{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 12px;border-radius:12px;background:var(--pearl);border:1px solid var(--line)}
.issue.bad{border-left:4px solid var(--bad)} .issue.warn{border-left:4px solid var(--warn)} .issue.info{border-left:4px solid var(--gold)}
.issue p{margin:2px 0;font-size:13px;color:var(--muted)}
.issue small{display:block}
.issues.compact .issue{grid-template-columns:auto minmax(0,1fr)}
.legal-sum.has-bad{border-color:#f2b9c6}

/* ---------- 表 ---------- */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl th.r,.tbl td.r{text-align:right}
.tbl thead th{font-size:11.5px;font-weight:700;color:var(--gold-ink);letter-spacing:.08em;white-space:nowrap;background:var(--surface);border-bottom:1px solid var(--gold-hi)}
.tbl tfoot td{font-weight:700;background:var(--blush);border-bottom:0}
.tbl.hover tbody tr{cursor:pointer}
.tbl.hover tbody tr:hover{background:var(--blush)}
.tbl .today{background:var(--today)}
.tbl.ledger tbody th{font-weight:400;color:var(--muted);white-space:nowrap}
.tbl.ledger tr.total th,.tbl.ledger tr.total td{font-weight:700;color:var(--ink);background:var(--blush)}
.week{min-width:880px}
.week th,.week td{text-align:center}
.week td:first-child,.week th:first-child{text-align:left}
.week .cell{cursor:pointer;min-width:100px}
.week .cell:hover{background:var(--blush)}
.week .add{color:var(--petal);font-size:18px}
.week .cell:hover .add{color:var(--rose)}
.tag{display:inline-flex;align-items:center;gap:3px;margin:2px;padding:3px 10px;border-radius:999px;font:700 12.5px var(--f-body);font-variant-numeric:tabular-nums;border:0;cursor:pointer;background:var(--c);color:#fff;box-shadow:0 3px 8px -4px var(--c)}
.tag.req{background:#fff;color:var(--ink);border:1.5px dashed var(--rose-hi);font-weight:500;cursor:default;box-shadow:none}
.mini{border:0;width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:12px;line-height:1;padding:0}
.mini.ok{background:var(--good-soft);color:var(--good)} .mini.ng{background:var(--bad-soft);color:var(--bad)}

/* 1日の階段表 */
.gantt{border-collapse:collapse;width:100%;min-width:960px;table-layout:fixed;font-size:12.5px;font-variant-numeric:tabular-nums}
.gantt col.g-name{width:124px} .gantt col.g-time{width:76px}
.gantt th,.gantt td{height:38px;padding:0 6px;border-bottom:1px solid var(--line)}
.gantt thead th{text-align:left;font:600 13px var(--f-num);color:var(--gold-ink);border-left:1px solid var(--line);padding-left:3px}
.gantt thead th:nth-child(-n+2){border-left:0;font:700 11.5px var(--f-body);letter-spacing:.08em}
.gantt td.slot{padding:0;border-left:1px dashed #f5e3ea}
.gantt td.slot.hour{border-left:1px solid var(--line)}
.gantt td.bar{padding:4px 0}
.gantt td.bar button{width:100%;height:28px;border:0;border-radius:999px;background:var(--c);color:#fff;font:700 12.5px var(--f-body);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 10px;box-shadow:0 4px 10px -6px var(--c)}
.gantt td.bar small{font-weight:500;opacity:.9}
.gantt tfoot td{text-align:center;font-weight:700;background:var(--blush);padding:0}
.gantt tfoot td:first-child{text-align:left;padding-left:6px}
.gantt tfoot td.lack{background:var(--bad-soft);color:var(--bad)}
.sumline{margin:12px 0 0;font-size:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* ---------- グラフ ---------- */
.chart-box{width:100%;overflow-x:auto}
.chart{width:100%;min-width:520px;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .grid.base{stroke:var(--gold-hi)}
.chart .axis{fill:var(--muted);font:12px var(--f-num)}
.chart .axis.sat{fill:var(--sat)} .chart .axis.sun{fill:var(--sun)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .bar{fill:var(--series);opacity:.78}
.chart .bar-g:hover .bar,.chart .bar-g.hl .bar{opacity:1}
.chart .bar-g:hover .hit{fill:rgba(200,51,111,.06)}
.tooltip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:#fff;font-size:12.5px;padding:7px 12px;border-radius:12px;line-height:1.5;border:1px solid rgba(232,207,159,.5)}
.tooltip .muted{color:#f3d6e2}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.rank li{display:grid;grid-template-columns:24px minmax(0,1.3fr) minmax(40px,1fr) auto;gap:10px;align-items:center;font-size:14px}
.rank-no{font:600 17px var(--f-num);color:var(--muted);text-align:right}
.rank li:nth-child(-n+3) .rank-no{background:var(--gilt);-webkit-background-clip:text;background-clip:text;color:transparent}
.rank-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-name small{color:var(--muted);margin-left:6px}
.rank-bar{height:8px;background:var(--blush);border-radius:4px;overflow:hidden}
.rank-bar i{display:block;height:100%;background:var(--shine);border-radius:4px}

<div class="proto-note">試作版：データはこの端末のブラウザにだけ保存されます。表示している人・金額はすべて見本です。メールは送信されません。</div>

<script>
/* ---- js/core.js ---- */
/* ミセカン 共通処理：日付・時刻・金額・保存・画面部品 */
'use strict';
const App = window.App = {};

/* ---------- 小さな道具 ---------- */
const U = App.U = {
  pad: n => String(n).padStart(2, '0'),
  ymd: d => `${d.getFullYear()}-${U.pad(d.getMonth() + 1)}-${U.pad(d.getDate())}`,
  parse: s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d || 1); },
  addDays: (s, n) => { const d = U.parse(s); d.setDate(d.getDate() + n); return U.ymd(d); },
  monday: s => { const d = U.parse(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return U.ymd(d); },
  today: () => U.ymd(new Date()),
  ym: s => s.slice(0, 7),
  ymAdd: (ym, n) => { const d = U.parse(ym + '-01'); d.setMonth(d.getMonth() + n); return U.ymd(d).slice(0, 7); },
  monthDays: ym => { const out = []; let d = ym + '-01'; while (d.startsWith(ym)) { out.push(d); d = U.addDays(d, 1); } return out; },
  WD: ['日', '月', '火', '水', '木', '金', '土'],
  wd: s => U.parse(s).getDay(),
  label: s => { const d = U.parse(s); return `${d.getMonth() + 1}/${d.getDate()}(${U.WD[d.getDay()]})`; },
  ymLabel: ym => `${ym.slice(0, 4)}年${+ym.slice(5, 7)}月`,
  /* その日時点の満年齢 */
  age: (birth, on) => { if (!birth) return null; const [y, m, d] = birth.split('-').map(Number); const [Y, M, D] = on.split('-').map(Number); return Y - y - ((M < m || (M === m && D < d)) ? 1 : 0); },
  wdClass: s => { const w = U.wd(s); return w === 0 ? 'sun' : w === 6 ? 'sat' : ''; },
  toMin: t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; },
  toHHMM: m => `${U.pad(Math.floor(m / 60))}:${U.pad(m % 60)}`,
  short: t => { const [h, m] = t.split(':'); return m === '00' ? String(+h) : `${+h}:${m}`; },
  nowHHMM: () => { const d = new Date(); return `${U.pad(d.getHours())}:${U.pad(d.getMinutes())}`; },
  hm: min => `${Math.floor(min / 60)}:${U.pad(Math.round(min % 60))}`,
  yen: n => '¥' + Math.round(n).toLocaleString('ja-JP'),
  num: n => Math.round(n).toLocaleString('ja-JP'),
  wareki: y => y >= 2019 ? `令和${y - 2018 === 1 ? '元' : y - 2018}年` : `${y}年`,
  esc: s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])),
  uid: () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
  sum: (arr, f) => arr.reduce((a, x) => a + (f ? f(x) : x), 0),
  timeOptions(from, to, step) { const o = []; for (let t = from * 60; t <= to * 60; t += step) o.push(U.toHHMM(t)); return o; },
  options: (list, sel) => list.map(v => Array.isArray(v)
    ? `<option value="${U.esc(v[0])}"${v[0] === sel ? ' selected' : ''}>${U.esc(v[1])}</option>`
    : `<option${v === sel ? ' selected' : ''}>${U.esc(v)}</option>`).join(''),
  overlap: (a1, a2, b1, b2) => Math.max(0, Math.min(a2, b2) - Math.max(a1, b1)),
};

/* ---------- 変更通知 ---------- */
App.bus = {
  fns: [],
  on(f) { this.fns.push(f); },
  emit(kind) { this.fns.forEach(f => { try { f(kind); } catch (e) { console.error(e); } }); },
};

/* ---------- 保存（試作版は端末のブラウザに保存） ---------- */
const KEY = 'misekan.v2';   // データの形を変えたので v2（v1 の見本データは使いません）
let mem = null;
App.Store = {
  get() {
    if (mem) return mem;
    try { const raw = localStorage.getItem(KEY); if (raw) mem = JSON.parse(raw); } catch (e) { mem = null; }
    if (!mem || !mem.staff) { mem = App.Seed.create(); this.save(true); }
    ['auditLog', 'mailLog', 'reads', 'reactions', 'requests', 'payrolls', 'sales', 'purchases', 'posts'].forEach(k => { if (!Array.isArray(mem[k])) mem[k] = []; });
    if (!Array.isArray(mem.items)) {   // 古いデータには商品マスタがないので、販売記録から作る
      const m = new Map(); mem.purchases.forEach(p => { if (!m.has(p.item)) m.set(p.item, { id: 'it' + (m.size + 1), name: p.item, category: p.category, price: p.price }); });
      mem.items = [...m.values()];
    }
    return mem;
  },
  save(silent) {
    try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) { /* 保存できない環境でも画面は動かす */ }
    if (!silent) App.bus.emit();
  },
  replace(d) { mem = d; this.save(); },
  reset() { mem = App.Seed.create(); this.save(); },
  staff(id) { return this.get().staff.find(s => s.id === id); },
  /* 変更の記録（労働時間の記録を後から直したとき、誰が・いつ・なぜ直したかを残す） */
  log(actor, action, target, detail, reason) {
    const d = this.get();
    d.auditLog.push({ at: new Date().toISOString().slice(0, 19), actor, action, target, detail: detail || '', reason: reason || '' });
  },
};
/* 管理者ページと従業員ページを同じ端末で開いているとき、片方の変更をもう片方に反映する */
addEventListener('storage', e => {
  if (e.key !== KEY) return;
  mem = null;
  App.bus.emit('external');
});
App.pref = {
  get(k, d) { try { const v = localStorage.getItem('misekan.pref.' + k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('misekan.pref.' + k, v); } catch (e) {} },
};

/* ---------- 画面部品 ---------- */
App.UI = {
  el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; },
  toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(this._tt); this._tt = setTimeout(() => { t.hidden = true; }, 2600);
  },
  /* ブラウザの confirm は使えない環境があるため、画面内で確認する */
  modal(title, bodyHtml, buttons) {
    const wrap = App.UI.el(`<div class="modal-back"><div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head"><h3>${U.esc(title)}</h3><button class="icon-btn" data-x aria-label="閉じる">×</button></div>
      <div class="modal-body">${bodyHtml}</div><div class="modal-foot"></div></div></div>`);
    const close = () => wrap.remove();
    const foot = wrap.querySelector('.modal-foot');
    (buttons || [{ label: '閉じる' }]).forEach(b => {
      const btn = App.UI.el(`<button class="btn ${b.kind || ''}">${U.esc(b.label)}</button>`);
      btn.onclick = () => { if (b.onClick && b.onClick(wrap) === false) return; close(); };
      foot.append(btn);
    });
    wrap.querySelector('[data-x]').onclick = close;
    wrap.addEventListener('click', e => { if (e.target === wrap) close(); });
    document.body.append(wrap);
    const f = wrap.querySelector('input,select,textarea'); if (f) f.focus();
    return { el: wrap, close };
  },
  confirm(msg, okLabel, danger) {
    return new Promise(res => App.UI.modal('確認', `<p>${U.esc(msg)}</p>`, [
      { label: 'やめる', onClick: () => res(false) },
      { label: okLabel || 'はい', kind: danger ? 'danger' : 'primary', onClick: () => res(true) },
    ]));
  },
  tip(e, html) {
    const t = document.getElementById('tooltip');
    if (!html) { t.hidden = true; return; }
    t.innerHTML = html; t.hidden = false;
    const r = t.getBoundingClientRect();
    let x = e.clientX + 14, y = e.clientY + 14;
    if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
    if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14;
    t.style.left = x + 'px'; t.style.top = y + 'px';
  },
  /* 期間切り替えバー */
  stepper(label, onPrev, onNext, extra) {
    const el = App.UI.el(`<div class="stepper"><button class="btn sm" aria-label="前へ">◀</button><b class="stepper-label">${label}</b><button class="btn sm" aria-label="次へ">▶</button>${extra || ''}</div>`);
    const [p, n] = el.querySelectorAll('button'); p.onclick = onPrev; n.onclick = onNext;
    return el;
  },
};

/* ---------- グラフ（縦棒・1系列） ---------- */
App.Chart = {
  bars(data, opt = {}) {
    const W = opt.width || 720, H = opt.height || 220, L = 56, R = 8, T = 12, B = 28;
    const max = Math.max(1, ...data.map(d => d.value));
    const step = niceStep(max / 4), top = Math.ceil(max / step) * step;
    const cw = (W - L - R) / data.length, bw = Math.max(2, Math.min(36, cw * 0.62));
    const y = v => T + (H - T - B) * (1 - v / top);
    let s = `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${U.esc(opt.label || '')}">`;
    for (let v = 0; v <= top; v += step) {
      s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="grid${v === 0 ? ' base' : ''}"/>`;
      s += `<text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" class="axis">${opt.fmtAxis ? opt.fmtAxis(v) : U.num(v)}</text>`;
    }
    const every = Math.ceil(data.length / (opt.maxLabels || 16));
    data.forEach((d, i) => {
      const cx = L + cw * i + cw / 2, h = Math.max(0, y(0) - y(d.value));
      const r = Math.min(4, bw / 2, h);
      s += `<g class="bar-g${d.hl ? ' hl' : ''}" data-i="${i}"><rect x="${L + cw * i}" y="${T}" width="${cw}" height="${H - T - B}" class="hit"/>`;
      if (h > 0) s += `<path class="bar" d="M${cx - bw / 2},${y(0)} V${y(0) - h + r} Q${cx - bw / 2},${y(0) - h} ${cx - bw / 2 + r},${y(0) - h} H${cx + bw / 2 - r} Q${cx + bw / 2},${y(0) - h} ${cx + bw / 2},${y(0) - h + r} V${y(0)} Z"/>`;
      s += `</g>`;
      if (i % every === 0) s += `<text x="${cx}" y="${H - 8}" text-anchor="middle" class="axis ${d.cls || ''}">${U.esc(d.label)}</text>`;
    });
    s += `</svg>`;
    const box = App.UI.el(`<div class="chart-box">${s}</div>`);
    box.querySelectorAll('.bar-g').forEach(g => {
      const d = data[+g.dataset.i];
      g.addEventListener('mousemove', e => App.UI.tip(e, `<b>${U.esc(d.tip || d.label)}</b><br>${opt.fmt ? opt.fmt(d.value) : U.num(d.value)}${d.sub ? '<br><span class="muted">' + U.esc(d.sub) + '</span>' : ''}`));
      g.addEventListener('mouseleave', e => App.UI.tip(e));
      if (opt.onClick) g.addEventListener('click', () => opt.onClick(d));
    });
    return box;
  },
  /* 横棒ランキング */
  ranking(rows, fmt) {
    const max = Math.max(1, ...rows.map(r => r.value));
    return App.UI.el(`<ol class="rank">${rows.map((r, i) => `<li>
      <span class="rank-no">${i + 1}</span>
      <span class="rank-name">${U.esc(r.label)}${r.sub ? `<small>${U.esc(r.sub)}</small>` : ''}</span>
      <span class="rank-bar"><i style="width:${(r.value / max * 100).toFixed(1)}%"></i></span>
      <span class="rank-val">${fmt ? fmt(r.value) : U.num(r.value)}</span></li>`).join('') || '<li class="muted">データがありません</li>'}</ol>`);
  },
};
function niceStep(x) { const p = Math.pow(10, Math.floor(Math.log10(x || 1))); const n = x / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }

/* ---------- 暗証番号の打ち間違いが続いたときの一時ロック（総当たり対策・試作版） ---------- */
App.Guard = {
  MAX: 5, LOCK_MIN: 5,
  read(k) { try { return JSON.parse(localStorage.getItem('misekan.guard.' + k)) || { n: 0, until: 0 }; } catch (e) { return { n: 0, until: 0 }; } },
  write(k, v) { try { localStorage.setItem('misekan.guard.' + k, JSON.stringify(v)); } catch (e) {} },
  /* ロック中なら残り分数、ロックされていなければ 0 */
  locked(k) { const g = this.read(k); return g.until > Date.now() ? Math.ceil((g.until - Date.now()) / 60000) : 0; },
  fail(k) { const g = this.read(k); g.n = (g.until && g.until < Date.now()) ? 1 : g.n + 1; g.until = g.n >= this.MAX ? Date.now() + this.LOCK_MIN * 60000 : 0; if (g.until) g.n = 0; this.write(k, g); return g.until ? this.LOCK_MIN : 0; },
  ok(k) { this.write(k, { n: 0, until: 0 }); },
};
/* ---------- 操作がないまま一定時間たったら閉じる ---------- */
App.idle = function (minutes, onIdle) {
  let t;
  const reset = () => { clearTimeout(t); t = setTimeout(onIdle, minutes * 60000); };
  ['pointerdown', 'keydown', 'scroll', 'touchstart'].forEach(ev => addEventListener(ev, reset, { passive: true }));
  reset();
};

<script>
/* ---- js/payroll.js ---- */
/* ミセカン 給与計算・労働時間・源泉徴収の計算（画面を持たない部品）
 *
 * 労働基準法などの決まりのうち、ここで計算しているもの
 *  - 32条  ：1日8時間・1週40時間を超えた分を時間外労働として数える（週は日曜はじまり。就業規則で決めた曜日に変えられる）
 *  - 34条  ：休憩は 労働時間が6時間を超えると45分以上、8時間を超えると60分以上（足りない日を知らせる）
 *  - 37条  ：時間外 25%以上、深夜（22時〜翌5時）25%以上、時間外が月60時間を超えた分は 50%以上
 *  - 24条  ：賃金は全額払い。法令で決まった控除（所得税・社会保険料・雇用保険料）以外は労使協定がないと引けない
 * 税・保険の数値は設定（settings）で変えられます。初期値は「要確認」の目印つきです。
 */
'use strict';
(function () {
  const U = App.U;

  App.defaultTax = () => ({
    version: '令和2〜7年分の電算機計算の特例（令和8年分は要確認）',
    zeroBelow: 88000,
    kyuyo: [[135416, null, 45834], [149999, 0.4, -8333], [299999, 0.3, 6667], [549999, 0.2, 36667], [708330, 0.1, 91667], [null, null, 162500]],
    kiso: 40000,
    fuyo: 31667,
    brackets: [[162500, 0.05105, 0], [275000, 0.1021, 8296], [579166, 0.2042, 36374], [750000, 0.23483, 54113], [1500000, 0.33693, 130688], [3333333, 0.4084, 237893], [null, 0.45945, 408061]],
    otsuBelow: 105000,
    otsuRate: 0.03063,
  });

  const Pay = App.Pay = {};
  const DAY_LIMIT = 8 * 60, WEEK_LIMIT = 40 * 60, M60 = 60 * 60;

  /* 1日分：実働・深夜・1日8時間超（分） */
  Pay.day = function (p) {
    if (!p || !p.in || !p.out) return null;
    const a = U.toMin(p.in); let b = U.toMin(p.out); if (b <= a) b += 1440;
    const brk = p.breakMin || 0;
    const work = Math.max(0, b - a - brk);
    // 深夜（22:00〜翌5:00）。休憩は深夜帯に取らない前提の簡易計算
    const night = Math.min(work, U.overlap(a, b, 22 * 60, 29 * 60) + U.overlap(a, b, 0, 5 * 60));
    return { work, night, otDay: Math.max(0, work - DAY_LIMIT), brk };
  };

  /* 34条：必要な休憩（分） */
  Pay.breakRequired = workPlusBreak => workPlusBreak > 8 * 60 ? 60 : workPlusBreak > 6 * 60 ? 45 : 0;
  Pay.breakShort = function (p) {
    const c = Pay.day(p); if (!c) return 0;
    // 休憩前の拘束時間ではなく「労働時間」で判定。休憩が足りないと労働時間が長くなるので、実働で判断する
    const need = c.work > 8 * 60 ? 60 : c.work > 6 * 60 ? 45 : 0;
    return Math.max(0, need - c.brk);
  };

  /* 1人の、ある期間の日ごとの時間（週40時間超を含む） */
  Pay.days = function (staffId, data, from, to) {
    const weekStart = data.settings.weekStart ?? 0;
    const back = (U.wd(from) - weekStart + 7) % 7;
    const start = U.addDays(from, -back);  // その週の初日から数える
    const byDate = {};
    data.punches.filter(p => p.staffId === staffId && p.date >= start && p.date <= to).forEach(p => { byDate[p.date] = p; });
    const out = {};
    let cum = 0;
    for (let d = start; d <= to; d = U.addDays(d, 1)) {
      if (U.wd(d) === weekStart) cum = 0;
      const c = Pay.day(byDate[d]);
      if (!c) continue;
      const regular = c.work - c.otDay;              // 1日8時間以内の部分
      const before = Math.max(0, cum - WEEK_LIMIT);
      cum += regular;
      const otWeek = Math.max(0, cum - WEEK_LIMIT) - before;   // この日に週40時間を超えた分
      if (d >= from) out[d] = { work: c.work, night: c.night, ot: c.otDay + otWeek, otWeek, brk: c.brk, punch: byDate[d] };
    }
    return out;
  };

  /* 源泉所得税（月額） */
  Pay.incomeTax = function (A, dependents, col, tax) {
    A = Math.max(0, Math.floor(A));
    const lim = r => (r[0] === null || r[0] === undefined) ? Infinity : r[0];
    if (col === '乙') {
      return { tax: Math.floor(A * tax.otsuRate), note: A < tax.otsuBelow ? '' : '乙欄で10万5千円以上は税額表で確認が必要です（試作では一律の率で概算）' };
    }
    if (A < tax.zeroBelow) return { tax: 0, note: '' };
    const k = tax.kyuyo.find(r => A <= lim(r));
    const kyuyo = k[1] === null ? k[2] : Math.ceil(A * k[1] + k[2]);
    const B = Math.max(0, A - kyuyo - tax.kiso - tax.fuyo * (dependents || 0));
    const br = tax.brackets.find(r => B <= lim(r));
    return { tax: Math.max(0, Math.round((B * br[1] - br[2]) / 10) * 10), note: '' };
  };

  /* 雇用保険料：50銭以下切り捨て、50銭超切り上げ（給与から引く場合の決まり） */
  Pay.roundIns = x => { const f = Math.floor(x); return x - f > 0.5 ? f + 1 : f; };

  /* 支給日（月末締め・翌月の給料日。31日などない日は月末） */
  Pay.payDate = function (ym, payDay) {
    const next = U.ymAdd(ym, 1), last = U.monthDays(next).length;
    return `${next}-${U.pad(Math.min(payDay, last))}`;
  };

  /* 1か月分の給与 */
  Pay.month = function (staff, ym, data) {
    const s = data.settings, days = U.monthDays(ym);
    const map = Pay.days(staff.id, data, days[0], days[days.length - 1]);
    const list = Object.values(map);
    const work = U.sum(list, x => x.work), night = U.sum(list, x => x.night), ot = U.sum(list, x => x.ot);
    const ot60 = Math.max(0, ot - M60);
    const wage = staff.wage;
    const base = Math.round(wage * work / 60);
    const otPay = Math.round(wage * (s.otRate - 1) * (ot - ot60) / 60 + wage * (s.ot60Rate - 1) * ot60 / 60);
    const nightPay = Math.round(wage * (s.nightRate - 1) * night / 60);
    const transport = (staff.transport || 0) * list.length;
    const gross = base + otPay + nightPay + transport;
    const taxable = gross - transport;                 // 通勤手当は非課税として扱う（上限内）
    const empIns = staff.empIns ? Pay.roundIns(gross * s.empInsRate) : 0;
    const social = staff.socialIns || 0;
    const it = Pay.incomeTax(taxable - empIns - social, staff.dependents, staff.taxCol, s.tax);
    const deductions = empIns + social + it.tax;
    return {
      ym, staffId: staff.id, name: staff.name, gender: staff.gender || '', wage, days: list.length,
      periodStart: days[0], periodEnd: days[days.length - 1], payDate: Pay.payDate(ym, s.payDay),
      workMin: work, otMin: ot, ot60Min: ot60, nightMin: night, base, otPay, nightPay, transport,
      gross, taxable, empIns, social, tax: it.tax, taxNote: it.note, deductions, net: gross - deductions,
      openDays: data.punches.filter(p => p.staffId === staff.id && p.date.startsWith(ym) && p.in && !p.out).length,
      storeName: s.storeName,
    };
  };

  /* 年間の給与所得控除（令和7年分以降の改正後の式。年末調整の表とは端数処理が異なる概算） */
  Pay.annualKyuyo = function (pay) {
    if (pay <= 1900000) return Math.min(pay, 650000);
    if (pay <= 3600000) return Math.floor(pay * 0.3 + 80000);
    if (pay <= 6600000) return Math.floor(pay * 0.2 + 440000);
    if (pay <= 8500000) return Math.floor(pay * 0.1 + 1100000);
    return 1950000;
  };
})();

</script>
<script>

'use strict';
App.Seed = {

    const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
    const today = U.today(), thisYm = U.ym(today);
    const COLORS = ['#c2185b', '#7b3f8c', '#2e8b7a', '#3f5ba9', '#b0803a', '#d0605e'];

    const staffDef = [
      ['S001', '佐藤 美咲', 'さとう みさき', 1250, 300, true, 0, 0, '甲', '1111', { 1: '09:00-14:00', 3: '09:00-14:00', 5: '09:00-14:00', 6: '09:00-17:00' }],
      ['S002', '鈴木 健太', 'すずき けんた', 1230, 400, true, 0, 0, '甲', '2222', { 1: '10:00-15:00', 2: '10:00-15:00', 4: '10:00-15:00', 5: '10:00-15:00', 0: '10:00-18:00' }],
      ['S003', '高橋 さくら', 'たかはし さくら', 1230, 0, false, 0, 0, '甲', '3333', { 2: '12:00-17:00', 3: '12:00-17:00', 5: '12:00-17:00', 6: '12:00-17:00' }],
      ['S004', '田中 翔', 'たなか しょう', 1350, 500, true, 0, 0, '甲', '4444', { 1: '14:00-22:00', 2: '14:00-22:00', 3: '14:00-22:00', 4: '14:00-22:00', 0: '13:00-22:00' }],
      ['S005', '伊藤 葵', 'いとう あおい', 1230, 200, false, 0, 0, '乙', '5555', { 3: '17:00-22:00', 4: '17:00-22:00', 5: '17:00-22:00', 6: '17:00-22:00' }],
      ['S006', '渡辺 大輔', 'わたなべ だいすけ', 1280, 300, true, 0, 1, '甲', '6666', { 1: '17:00-22:00', 2: '09:00-14:00', 4: '17:00-22:00', 6: '17:00-22:00', 0: '17:00-22:00' }],
    ];
    const staff = staffDef.map((d, i) => ({
      id: 'st' + (i + 1), code: d[0], name: d[1], kana: d[2], role: i === 3 ? 'バイトリーダー' : 'アルバイト',
      wage: d[3], transport: d[4], empIns: d[5], socialIns: d[6], dependents: d[7], taxCol: d[8], pin: d[9],
      color: COLORS[i], phone: `090-0000-${String(1001 + i)}`, hireDate: U.addDays(today, -ri(120, 900)),
      birth: `${ri(1985, 2005)}-${U.pad(ri(1, 12))}-${U.pad(ri(1, 28))}`, active: true, note: '', pattern: d[10],
      // 労働者名簿（労働基準法107条・施行規則53条）の項目
      gender: ['女性', '男性', '女性', '男性', '女性', '男性'][i], address: `東京都〇〇区〇〇町${i + 1}-${i + 2}（見本）`,
      history: '（見本）前職：飲食店ホール', job: i === 3 ? '接客・調理・締め作業' : '接客・調理補助',
      retireDate: '', retireReason: '', deathDate: '', deathCause: '',
      // メール配信（給与明細の電子交付には本人の承諾が必要：所得税法231条2項）
      email: `staff${i + 1}@example.com`, consent: i !== 2, consentDate: i !== 2 ? U.addDays(today, -ri(30, 200)) : '',
    }));

    const shifts = [], punches = [], requests = [];
    const start = U.ymAdd(thisYm, -2) + '-01';
    const thisMon = U.monday(today), nextMon = U.addDays(thisMon, 7);
    const nowMin = U.toMin(U.nowHHMM());
    for (let d = start; d < nextMon; d = U.addDays(d, 1)) {
      for (const st of staff) {
        const pt = st.pattern[U.wd(d)]; if (!pt || rnd() < 0.06) continue;
        const [s, e] = pt.split('-');
        shifts.push({ id: U.uid() + ri(0, 999), staffId: st.id, date: d, start: s, end: e });
        if (d > today) continue;
        const inM = U.toMin(s) - ri(0, 12) + (rnd() < 0.08 ? ri(5, 15) : 0);
        let outM = U.toMin(e) + ri(0, 15) + (e === '22:00' && rnd() < 0.3 ? ri(10, 40) : 0);
        const len = outM - inM;
        // 34条：労働時間が6時間を超えたら45分、8時間を超えたら60分の休憩
        const breakMin = len - 45 > 8 * 60 ? 60 : len > 6 * 60 ? 45 : 0;
        if (d === today) {
          if (nowMin < inM) continue;
          punches.push({ id: U.uid() + ri(0, 999), staffId: st.id, date: d, in: U.toHHMM(inM), out: nowMin >= outM ? U.toHHMM(outM) : '', breakMin: nowMin >= outM ? breakMin : 0, breakStart: '' });

          punches.push({ id: U.uid() + ri(0, 999), staffId: st.id, date: d, in: U.toHHMM(inM), out: U.toHHMM(outM), breakMin, breakStart: '' });

      for (const st of staff) {
        const pt = st.pattern[U.wd(d)]; if (!pt || rnd() < 0.15) continue;
        const [s, e] = pt.split('-');
        requests.push({ id: U.uid() + ri(0, 999), staffId: st.id, date: d, start: s, end: e, note: '', status: 'pending', createdAt: new Date().toISOString() });

    }
    requests.push({ id: U.uid() + 'x', staffId: 'st3', date: U.addDays(nextMon, 0), start: '12:00', end: '17:00', note: '月曜も入れます', status: 'pending', createdAt: new Date().toISOString() });

    // 売上（13か月分）
    const sales = [];
    const sStart = U.ymAdd(thisYm, -12) + '-01';
    for (let d = sStart; d < today; d = U.addDays(d, 1)) {
      const w = U.wd(d), m = +d.slice(5, 7);
      const wf = [1.25, 0.85, 0.85, 0.9, 0.95, 1.15, 1.35][w];
      const mf = [0.9, 0.85, 1.0, 1.05, 1.1, 0.95, 1.1, 1.15, 1.0, 1.0, 1.0, 1.2][m - 1];
      const amount = Math.round(215000 * wf * mf * (0.85 + rnd() * 0.3) / 10) * 10;
      sales.push({ date: d, amount, customers: Math.round(amount / ri(1350, 1650)), note: '' });
    }

    // 商品マスタ
    const items = [
      ['ブレンドコーヒー', 'ドリンク', 450, 10], ['カフェラテ', 'ドリンク', 520, 9], ['アイスティー', 'ドリンク', 480, 5],
      ['季節のフルーツティー', 'ドリンク', 650, 4], ['クラブハウスサンド', 'フード', 980, 6], ['ナポリタン', 'フード', 1050, 5],
      ['日替わりランチ', 'フード', 1100, 9], ['キーマカレー', 'フード', 1000, 6], ['ガトーショコラ', 'デザート', 520, 5],
      ['チーズケーキ', 'デザート', 500, 6], ['プリン', 'デザート', 420, 4], ['焼き菓子セット', 'テイクアウト', 1200, 2], ['コーヒー豆 200g', 'テイクアウト', 1600, 1]]
      .map(([name, category, price, w], i) => ({ id: 'it' + (i + 1), name, category, price, w }));
    // 購買履歴（直近45日）：会員の購入（1件ずつ）＋ 商品ごとの1日分の集計。
    // この45日は「売上の合計＝明細の合計」になるように、売上の金額を明細から決める（矛盾をなくす）
    const members = ['会員0012', '会員0035', '会員0047', '会員0101', '会員0128', '会員0150', '会員0203'];
    const sumW = U.sum(items, x => x.w);
    const purchases = [];
    for (let d = U.addDays(today, -45); d < today; d = U.addDays(d, 1)) {
      const sale = sales.find(x => x.date === d); if (!sale) continue;
      let total = 0;
      for (let k = 0, n = ri(3, 8); k < n; k++) {
        const it = items[ri(0, items.length - 1)], qty = rnd() < 0.2 ? 2 : 1;
        purchases.push({ id: U.uid() + 'm' + k, date: d, time: U.toHHMM(ri(9 * 60, 21 * 60 + 30)), itemId: it.id, item: it.name, category: it.category, price: it.price, qty, customer: members[ri(0, members.length - 1)] });
        total += it.price * qty;
      }
      const rest = Math.max(0, sale.amount - total);
      items.forEach((it, k) => {
        const qty = Math.max(0, Math.round(rest * it.w / sumW / it.price * (0.8 + rnd() * 0.4)));
        if (!qty) return;
        purchases.push({ id: U.uid() + 'a' + k, date: d, time: '', itemId: it.id, item: it.name, category: it.category, price: it.price, qty, customer: '' });
        total += it.price * qty;
      });
      sale.amount = total;                                   // 明細の合計とそろえる
      sale.customers = Math.max(1, Math.round(total / ri(1350, 1650)));
    }
    items.forEach(x => delete x.w);

    const iso = (d, t) => `${d}T${t}:00`;
    const posts = [
      { id: 'p1', title: '年末年始の営業時間について', body: '12/31は17時閉店、1/1〜1/3は休業です。\n12月後半のシフト希望は12/10までに提出してください。', important: true, pinned: true, createdAt: iso(U.addDays(today, -3), '10:00') },
      { id: 'p2', title: '新メニュー試食会', body: '来週の水曜15時から、冬の新メニューの試食会をします。参加できる人はリアクションで教えてください。', important: false, pinned: false, createdAt: iso(U.addDays(today, -1), '18:30') },
      { id: 'p3', title: '打刻忘れに気をつけてください', body: '退勤の打刻忘れが続いています。帰る前に従業員ページの「退勤」を押したか確認をお願いします。', important: false, pinned: false, createdAt: iso(U.addDays(today, -8), '09:15') },
    ];
    const reads = [], reactions = [];
    const rr = (p, s, emoji) => { reads.push({ postId: p, staffId: s, at: iso(today, '08:00') }); if (emoji) reactions.push({ postId: p, staffId: s, emoji, at: iso(today, '08:00') }); };
    rr('p1', 'st1', '了解'); rr('p1', 'st2', '了解'); rr('p1', 'st4', '👍'); rr('p1', 'st6');
    rr('p2', 'st1', '🙋'); rr('p2', 'st3', '🙋'); rr('p2', 'st4', '👍');
    ['st1', 'st2', 'st3', 'st4', 'st5', 'st6'].forEach(s => rr('p3', s, s === 'st5' ? '❤️' : '了解'));

    const data = {
      version: 1, demo: true,
      settings: {
        storeName: 'カフェ駅前店（見本）', employer: '株式会社〇〇（見本）', openHour: 9, closeHour: 22, step: 30, need: 2,
        otRate: 1.25, ot60Rate: 1.5, nightRate: 1.25, weekStart: 0, payDay: 25, laborTarget: 30, adminPin: '0000',
        empInsRate: 0.0055, empInsNote: '令和7年度 一般の事業・労働者負担（令和8年4月以降は要確認）',
        minWage: 1226, minWagePref: '東京都', minWageNote: '令和7年10月改定の額（要確認：毎年10月ごろ改定）',
        agreement36: true, limitMonth: 45, limitYear: 360,
        tax: App.defaultTax(),
        mail: { enabled: false, timing: 'unset', day: 1, fromName: 'カフェ駅前店（見本）', subject: '【{店舗名}】{年月}分 給与明細・勤怠・シフトのお知らせ', payslip: true, attendance: true, shift: true },
      },
      staff, shifts, requests, punches, payrolls: [], sales, items, purchases, posts, reads, reactions, auditLog: [], mailLog: [],
    };
    staff.forEach(s => delete s.pattern);
    // 先々月・先月の給与は確定済みにしておく
    [U.ymAdd(thisYm, -2), U.ymAdd(thisYm, -1)].forEach(ym => staff.forEach(st => {
      const p = App.Pay.month(st, ym, data);
      if (p.days) data.payrolls.push(Object.assign(p, { id: U.uid() + st.id, confirmedAt: new Date().toISOString() }));
    }));
    return data;
  },
};

</script>
<script>
/* ---- js/payslip.js ---- */
/* ミセカン 給与明細の表示（管理者ページ・従業員ページで共通） */
'use strict';
(function () {
  const U = App.U;
  /*
   * 記載している主な項目：支給額と源泉徴収税額・社会保険料等の額（所得税法231条・同施行規則100条）、
   * 計算期間・労働日数・労働時間数・時間外/深夜労働時間数・賃金と控除の内訳（賃金台帳と同じ項目：労働基準法施行規則54条）
   */
  App.payslipHtml = function (p, opt) {
    opt = opt || {};
    const row = (l, v, cls) => `<tr class="${cls || ''}"><th>${l}</th><td class="r num">${v}</td></tr>`;
    return `<div class="slip">
      <div class="slip-head"><div><b class="slip-title">給与明細書</b><span class="slip-ym">${U.ymLabel(p.ym)}分${opt.draft ? '（見込み・未確定）' : ''}</span></div>
        <div class="slip-to"><b>${U.esc(p.name)}</b> 様<br><small class="muted">${U.esc(opt.employer || '')} ${U.esc(p.storeName || '')}</small></div></div>
      <dl class="slip-meta"><div><dt>計算期間</dt><dd>${U.label(p.periodStart)}〜${U.label(p.periodEnd)}</dd></div><div><dt>支給日</dt><dd>${U.label(p.payDate)}</dd></div></dl>
      <div class="slip-grid">
        <table class="slip-t"><caption>勤怠</caption>${row('時給', U.yen(p.wage))}${row('労働日数', p.days + '日')}${row('労働時間数', U.hm(p.workMin))}${row('時間外労働時間数', U.hm(p.otMin))}${p.ot60Min ? row('うち月60時間超', U.hm(p.ot60Min)) : ''}${row('深夜労働時間数', U.hm(p.nightMin))}</table>
        <table class="slip-t"><caption>支給</caption>${row('基本給（時給×労働時間）', U.yen(p.base))}${row('時間外労働手当', U.yen(p.otPay))}${row('深夜労働手当', U.yen(p.nightPay))}${row('通勤手当（非課税）', U.yen(p.transport))}${row('総支給額', U.yen(p.gross), 'total')}</table>
        <table class="slip-t"><caption>控除</caption>${row('雇用保険料', U.yen(p.empIns))}${row('社会保険料', U.yen(p.social))}${row('所得税（源泉徴収税額）', U.yen(p.tax))}${row('控除合計', U.yen(p.deductions), 'total')}</table>
      </div>
      <div class="slip-net"><span>差引支給額</span><b class="num">${U.yen(p.net)}</b></div>
      ${p.taxNote ? `<p class="notice">${U.esc(p.taxNote)}</p>` : ''}
      <p class="slip-foot">課税支給額 ${U.yen(p.taxable)} ・ 割増：時間外25%（月60時間超は50%）・深夜25%</p>
    </div>`;
  };

})();

</script>
<script>
/* ---- js/admin.js ---- */
/* ミセカン 管理画面：タブの仕組み・ホーム・掲示板・従業員名簿・設定 */
'use strict';
(function () {
  const U = App.U, UI = App.UI, S = App.Store;
  const tabs = [];
  const Admin = App.Admin = {
    groups: ['ホーム', '現場', '人事・給与', '売上', 'その他'],
    register(t) { tabs.push(t); },
    current: 'dashboard',
    show(id) {
      if (!tabs.some(t => t.id === id)) id = 'dashboard';
      Admin.current = id; Admin.renderNav(); Admin.renderMain();
    },
    renderNav() {
      const nav = document.getElementById('sideNav');
      nav.innerHTML = Admin.groups.map(g => {
        const ts = tabs.filter(t => t.group === g); if (!ts.length) return '';
        return `<div class="nav-group"><div class="nav-title">${g}</div>${ts.map(t => {
          const b = t.badge ? t.badge() : 0;
          return `<a href="#${t.id}" class="nav-item${t.id === Admin.current ? ' on' : ''}" aria-current="${t.id === Admin.current ? 'page' : 'false'}">${t.label}${b ? `<span class="badge">${b}</span>` : ''}</a>`;
        }).join('')}</div>`;
      }).join('');
      document.getElementById('storeName').textContent = S.get().settings.storeName;
    },
    renderMain() {
      const t = tabs.find(x => x.id === Admin.current);
      const main = document.getElementById('adminMain');
      main.innerHTML = '';
      main.append(UI.el(`<div class="page-head"><h1>${t.label}</h1>${t.lead ? `<p class="lead">${t.lead}</p>` : ''}</div>`));
      const src = Admin.SOURCES[t.id];
      if (src) {
        const bar = UI.el(`<div class="sources" aria-label="このページのデータの出どころ"><span class="sources-title">データの出どころ</span>${src.map(([to, what, who]) =>
          to === 'self' ? `<button type="button" class="src-chip self" data-jump>${what}<small>${who}</small><span aria-hidden="true">↓</span></button>`
          : to === 'staffpage' ? `<span class="src-chip staffp">${what}<small>${who}</small></span>`
          : `<a class="src-chip" href="#${to}">${what}<small>${who}</small><span aria-hidden="true">→</span></a>`).join('')}</div>`);
        bar.querySelectorAll('[data-jump]').forEach(btn => { btn.onclick = () => { const f = main.querySelector('[data-input]'); if (f) { f.scrollIntoView({ behavior: 'smooth', block: 'start' }); const i = f.querySelector('input:not([type=checkbox]),select,textarea,button'); if (i) setTimeout(() => i.focus({ preventScroll: true }), 300); } }; });
        main.append(bar);
      }
      t.render(main);
    },
    refresh() { Admin.renderNav(); Admin.renderMain(); },
  };
  /* 各タブの数字が、どこで入力したデータから来ているか。
   * [行き先のタブ, データの名前, 誰が入力するか]。行き先 'self' はこのページの入力欄、'staffpage' は従業員ページ */
  Admin.SOURCES = {
    dashboard: [['sales', '売上', '管理者が「毎日の売上」で入力'], ['attendance', '出勤・打刻', '従業員が打刻／管理者が修正'], ['shift', 'シフト', '管理者が「シフト」で作成'], ['staff', '時給', '管理者が「従業員名簿」で入力'], ['board', 'お知らせ', '管理者が「掲示板」で入力']],
    legal: [['attendance', '打刻', '従業員が打刻／管理者が修正'], ['staff', '名簿・時給・生年月日', '管理者が入力'], ['config', '最低賃金・36協定・税', '管理者が「設定」で入力']],
    board: [['self', 'お知らせ', 'このページで管理者が書く・直す'], ['staffpage', '既読・リアクション', '従業員ページで本人が押す']],
    shift: [['self', 'シフト', 'このページで管理者が作成・変更'], ['staffpage', 'シフト希望', '従業員ページで本人が提出']],
    attendance: [['staffpage', '打刻', '従業員ページで本人が押す'], ['self', '打刻の手入力・修正', 'このページで管理者が入力（理由が必須）']],
    staff: [['self', '従業員の情報・時給・保険・税・連絡先', 'このページで管理者が入力']],
    payroll: [['attendance', '労働時間', '打刻から計算'], ['staff', '時給・交通費・保険・扶養', '従業員名簿'], ['config', '割増率・保険料率・税', '設定']],
    payslip: [['payroll', '確定した給与', '「給与計算」で確定したもの']],
    ledger: [['payroll', '確定した給与', '「給与計算」で確定したもの'], ['staff', '性別・業務', '従業員名簿']],
    tax: [['payroll', '確定した給与', '「給与計算」で確定したもの'], ['staff', '税区分・扶養', '従業員名簿']],
    mail: [['self', '送信の設定', 'このページで管理者が入力'], ['staff', 'メールアドレス・同意', '従業員名簿'], ['payroll', '給与明細', '確定した給与'], ['attendance', '勤怠', '打刻'], ['shift', 'シフト', '確定したシフト']],
    sales: [['self', '売上（レジ締めの合計・客数）', 'このページで管理者が入力'], ['purchases', '商品ごとの明細', '「購買履歴」で入力']],
    purchases: [['self', '商品ごとの販売記録・商品マスタ', 'このページで管理者が入力'], ['sales', '売上の合計', '「毎日の売上」で入力']],
    config: [['self', '店舗・計算・法令の数値', 'このページで管理者が入力']],
  };

  App.bus.on(kind => {
    if (!document.getElementById('adminMain')) return;
    Admin.renderNav();
    // 従業員ページでの打刻・希望などを反映。入力中・確認画面を開いているときは書き換えない
    const busy = document.querySelector('.modal-back') || (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName));
    if (kind === 'external' && !busy) Admin.renderMain();
  });

  /* 打刻の状態 */
  Admin.punchState = function (p, shift, date) {
    const now = U.toMin(U.nowHHMM());
    if (p && p.out) return ['退勤済み', 'chip'];
    if (p && p.breakStart) return ['休憩中', 'chip warn'];
    if (p && p.in) return [shift && U.toMin(p.in) > U.toMin(shift.start) ? '出勤中（遅刻）' : '出勤中', shift && U.toMin(p.in) > U.toMin(shift.start) ? 'chip warn' : 'chip good'];
    if (shift && date === U.today() && now > U.toMin(shift.start)) return ['未出勤', 'chip bad'];
    if (shift && date < U.today()) return ['打刻なし', 'chip bad'];
    return ['出勤前', 'chip'];
  };

  /* ================= ホーム ================= */
  Admin.register({
    id: 'dashboard', label: 'ホーム', group: 'ホーム', lead: '今日の店の状況をひと目で確認します。',
    render(main) {
      const d = S.get(), today = U.today(), ym = U.ym(today), yest = U.addDays(today, -1);
      const salesM = U.sum(d.sales.filter(s => s.date.startsWith(ym)), s => s.amount);
      const lastYm = U.ymAdd(ym, -12);
      const dayN = +yest.slice(8, 10);
      const salesLY = U.sum(d.sales.filter(s => s.date.startsWith(lastYm) && +s.date.slice(8, 10) <= dayN), s => s.amount);
      const ySales = d.sales.find(s => s.date === yest);
      const labor = U.sum(d.staff.filter(s => s.active), st => App.Pay.month(st, ym, d).gross);
      const ratio = salesM ? labor / salesM * 100 : 0;
      const todayShifts = d.shifts.filter(s => s.date === today).sort((a, b) => U.toMin(a.start) - U.toMin(b.start));
      const working = d.punches.filter(p => p.date === today && p.in && !p.out).length;
      const pending = d.requests.filter(r => r.status === 'pending').length;
      const diff = salesLY ? (salesM / salesLY - 1) * 100 : 0;

      main.append(UI.el(`<section class="tiles">
        <div class="tile"><span class="tile-label">昨日の売上</span><b class="tile-num">${ySales ? U.yen(ySales.amount) : '未入力'}</b><span class="tile-sub">${ySales ? `客数 ${ySales.customers}人 ・ 客単価 ${U.yen(ySales.amount / Math.max(1, ySales.customers))}` : '<span class="chip warn">まだ入力されていません</span>'}</span><a class="src-link" href="#sales">入力：毎日の売上 →</a></div>
        <div class="tile"><span class="tile-label">今月の売上（${+ym.slice(5)}/1〜昨日）</span><b class="tile-num">${U.yen(salesM)}</b><span class="tile-sub"><span class="chip ${diff >= 0 ? 'good' : 'bad'}">${diff >= 0 ? '▲' : '▼'} ${Math.abs(diff).toFixed(1)}%</span> 前年同期比</span><a class="src-link" href="#sales">入力：毎日の売上 →</a></div>
        <div class="tile"><span class="tile-label">今月の人件費（見込み）</span><b class="tile-num">${U.yen(labor)}</b><span class="tile-sub"><span class="chip ${ratio <= d.settings.laborTarget ? 'good' : 'warn'}">人件費率 ${ratio.toFixed(1)}%</span> 目標 ${d.settings.laborTarget}%</span><a class="src-link" href="#attendance">打刻×時給（勤怠・従業員名簿）→</a></div>
        <div class="tile"><span class="tile-label">今日の出勤</span><b class="tile-num">${todayShifts.length}人<small> / 出勤中 ${working}人</small></b><span class="tile-sub">${pending ? `<a href="#shift" class="chip warn">シフト希望 ${pending}件が未承認</a>` : '未承認のシフト希望はありません'}</span><a class="src-link" href="#shift">シフト・打刻 →</a></div>
      </section>`));

      if (App.Legal) {
        const iss = App.Legal.issues(d), bad = iss.filter(i => i.level === 'bad'), warn = iss.filter(i => i.level === 'warn');
        main.append(UI.el(`<section class="card legal-sum ${bad.length ? 'has-bad' : ''}"><div class="card-head"><h2>法令チェック</h2><a class="btn sm" href="#legal">すべて見る</a></div>
          ${bad.length + warn.length ? `<ul class="issues compact">${[...bad, ...warn].slice(0, 3).map(i => `<li class="issue ${i.level}"><span class="chip ${i.level}">${i.level === 'bad' ? 'すぐ対応' : '確認'}</span><div><b>${U.esc(i.title)}</b><small class="muted">${U.esc(i.law)}</small></div></li>`).join('')}</ul>${bad.length + warn.length > 3 ? `<p class="muted small">ほか ${bad.length + warn.length - 3} 件</p>` : ''}` : '<p class="muted">すぐ対応が必要なこと・確認が必要なことは見つかっていません（数値の確認のお知らせは「法令チェック」に出ています）。</p>'}</section>`));
      }
      const grid = UI.el(`<div class="grid-2"></div>`);
      const now = UI.el(`<section class="card"><h2>今日の出勤状況 <small class="muted">${U.label(today)}</small></h2><div class="scroll"><table class="tbl"><thead><tr><th>名前</th><th>シフト</th><th>出勤</th><th>退勤</th><th>状態</th></tr></thead><tbody>${todayShifts.map(s => {
        const st = S.staff(s.staffId) || { name: '(削除済み)', color: '#888' };
        const p = d.punches.find(x => x.staffId === s.staffId && x.date === today);
        const [lab, cls] = Admin.punchState(p, s, today);
        return `<tr><td><i class="dot" style="background:${st.color}"></i>${U.esc(st.name)}</td><td class="mono">${U.short(s.start)}-${U.short(s.end)}</td><td class="mono">${p && p.in ? p.in : '−'}</td><td class="mono">${p && p.out ? p.out : '−'}</td><td><span class="${cls}">${lab}</span></td></tr>`;
      }).join('') || '<tr><td colspan="5" class="muted">今日のシフトはありません</td></tr>'}</tbody></table></div></section>`);
      grid.append(now);

      const board = UI.el(`<section class="card"><h2>掲示板の既読</h2><ul class="plain">${d.posts.slice().sort((a, b) => b.createdAt.localeCompare(a.createdAt)).slice(0, 4).map(p => {
        const n = d.staff.filter(s => s.active).length, r = d.reads.filter(x => x.postId === p.id && S.staff(x.staffId)?.active).length;
        return `<li><a href="#board">${U.esc(p.title)}</a><span class="meter"><i style="width:${n ? r / n * 100 : 0}%"></i></span><span class="mono">${r}/${n}</span></li>`;
      }).join('')}</ul></section>`);
      grid.append(board);
      main.append(grid);

      const months = []; for (let i = 11; i >= 0; i--) months.push(U.ymAdd(ym, -i));
      const card = UI.el(`<section class="card"><h2>月別の売上 <small class="muted">直近12か月・今月は昨日まで</small></h2></section>`);
      card.append(App.Chart.bars(months.map(m => ({ label: `${+m.slice(5)}月`, tip: U.ymLabel(m), value: U.sum(d.sales.filter(s => s.date.startsWith(m)), s => s.amount) })),
        { fmt: U.yen, fmtAxis: v => (v / 10000).toLocaleString('ja-JP') + '万', label: '月別の売上' }));
      main.append(card);
    },
  });

    badge() { const d = S.get(); const n = d.staff.filter(s => s.active); return d.posts.filter(p => p.important && n.some(s => !d.reads.some(r => r.postId === p.id && r.staffId === s.id))).length; },

      };

      const active = d.staff.filter(s => s.active);
      d.posts.slice().sort((a, b) => (b.pinned - a.pinned) || b.createdAt.localeCompare(a.createdAt)).forEach(p => {
        const readers = active.filter(s => d.reads.some(r => r.postId === p.id && r.staffId === s.id));
        const unread = active.filter(s => !readers.includes(s));
        const rs = d.reactions.filter(r => r.postId === p.id);
        const byEmoji = {}; rs.forEach(r => { (byEmoji[r.emoji] = byEmoji[r.emoji] || []).push(S.staff(r.staffId)?.name || '?'); });
        const card = UI.el(`<article class="card post">

            <div class="reacts">${Object.entries(byEmoji).map(([e, names]) => `<span class="react" title="${U.esc(names.join('、'))}">${U.esc(e)} ${names.length}<small>${U.esc(names.map(n => n.split(' ')[0]).join('・'))}</small></span>`).join('') || '<span class="muted">リアクションはまだありません</span>'}</div>
          </div>
          <details><summary>読んだ人・まだの人</summary><div class="who">
            <div><b>読んだ人</b> ${readers.map(s => `<span class="chip good">${U.esc(s.name)}</span>`).join('') || '<span class="muted">なし</span>'}</div>
            <div><b>まだの人</b> ${unread.map(s => `<span class="chip bad">${U.esc(s.name)}</span>`).join('') || '<span class="muted">全員読みました</span>'}</div></div></details>
          <div class="row-end"><button class="btn sm" data-edit>編集</button><button class="btn sm" data-pin>${p.pinned ? '固定をはずす' : '一番上に固定'}</button><button class="btn sm danger" data-del>削除</button></div>
        </article>`);
        card.querySelector('[data-pin]').onclick = () => { p.pinned = !p.pinned; S.save(); Admin.refresh(); };
        card.querySelector('[data-edit]').onclick = () => UI.modal('お知らせを編集', `<form class="form one">
            <label class="field">タイトル<input id="e_t" value="${U.esc(p.title)}" maxlength="60"></label>
            <label class="field">本文<textarea id="e_b" rows="5">${U.esc(p.body)}</textarea></label>
            <label class="check"><input type="checkbox" id="e_i" ${p.important ? 'checked' : ''}> 重要</label>
            <p class="muted small">すでに読んだ人の既読はそのまま残ります。大事な変更のときは、新しいお知らせとして出し直すと全員にもう一度読んでもらえます。</p><p class="err" id="e_err"></p></form>`,
          [{ label: 'やめる' }, { label: '保存する', kind: 'primary', onClick: w => {
            const t = w.querySelector('#e_t').value.trim(), bd = w.querySelector('#e_b').value.trim();
            if (!t || !bd) { w.querySelector('#e_err').textContent = 'タイトルと本文を入れてください。'; return false; }
            p.title = t; p.body = bd; p.important = w.querySelector('#e_i').checked; p.editedAt = new Date().toISOString().slice(0, 16);
            S.save(); UI.toast('お知らせを直しました'); Admin.refresh();
          } }]);
        card.querySelector('[data-del]').onclick = async () => {
          if (!await UI.confirm(`「${p.title}」を削除します。既読とリアクションも消えます。`, '削除する', true)) return;
          d.posts = d.posts.filter(x => x !== p); d.reads = d.reads.filter(x => x.postId !== p.id); d.reactions = d.reactions.filter(x => x.postId !== p.id);
          S.save(); Admin.refresh();

        main.append(card);
      });
    },
  });

  /* ================= 従業員名簿（労働者名簿） ================= */
  // 労働基準法107条・施行規則53条で記入が決まっている項目には「法定」の印を付けます
  const SECTIONS = [
    ['基本', [
      ['code', '従業員番号', 'text'], ['name', '氏名', 'text', 'law', true], ['kana', 'ふりがな', 'text'],
      ['gender', '性別', 'select:女性,男性,その他', 'law'], ['birth', '生年月日', 'date', 'law'],

      ['hireDate', '雇入れ年月日', 'date', 'law'], ['job', '従事する業務の種類', 'text', 'law'],
      ['role', '役割', 'text'], ['history', '履歴（前職・資格など）', 'text', 'law'],
    ]],
    ['給与・保険・税', [
      ['wage', '時給（円）', 'number', '', true], ['transport', '交通費（1日・円）', 'number'],
      ['dependents', '扶養人数', 'number'], ['socialIns', '社会保険料（月額・手入力）', 'number'],

    ]],
    ['従業員ページ・メール', [
      ['pin', '従業員ページの暗証番号（4桁）', 'text', '', true], ['email', 'メールアドレス', 'email'],
      ['consentDate', '電子交付に同意した日', 'date'],
    ]],
    ['退職・死亡（該当するときだけ）', [
      ['retireDate', '退職年月日', 'date', 'law'], ['retireReason', '退職の事由（解雇の場合はその理由）', 'text', 'law'],

  const ALL = SECTIONS.flatMap(s => s[1]);
  function inputHtml([k, l, t, law, req], st) {
    const lab = `${l}${law ? ' <span class="law-tag">法定</span>' : ''}${req ? ' <span class="req">必須</span>' : ''}`;
    if (t.startsWith('select:')) return `<label class="field">${lab}<select id="f_${k}">${U.options([...(k === 'gender' ? [['', '（未記入）']] : []), ...t.slice(7).split(',').map(x => [x, x])], st[k] || '')}</select></label>`;
    return `<label class="field">${lab}<input id="f_${k}" type="${t}" value="${U.esc(st[k] ?? '')}"${t === 'number' ? ' min="0" step="1"' : ''}${k === 'pin' ? ' inputmode="numeric" maxlength="4"' : ''}></label>`;
  }
  function staffForm(st, isNew) {
    const s = S.get().settings;
    const html = `<p class="err form-err" id="f_err" role="alert"></p><p class="muted small"><span class="req">必須</span> の3つ（氏名・時給・暗証番号）を入れれば登録できます。<span class="law-tag">法定</span> の項目は労働者名簿に必要なので、わかりしだい入れてください（未記入は「法令チェック」に出ます）。</p><form class="form" novalidate>${SECTIONS.map(([title, fs]) => `<h4 class="wide form-sec">${title}</h4>${fs.map(f => inputHtml(f, st)).join('')}${title === '給与・保険・税' ? `
      <label class="check wide"><input type="checkbox" id="f_empIns" ${st.empIns ? 'checked' : ''}> 雇用保険に加入（週20時間以上・31日以上の雇用見込み）</label>
      <p class="wide small muted">最低賃金（${U.esc(s.minWagePref)}）：${U.yen(s.minWage)}。これより低い時給は保存できません（最低賃金法4条）。</p>` : ''}${title === '従業員ページ・メール' ? `
      <label class="check wide"><input type="checkbox" id="f_consent" ${st.consent ? 'checked' : ''}> 給与明細をメール（電子）で受け取ることに本人が同意している</label>
      <p class="wide small muted">給与明細を電子で渡すには、本人の承諾が必要です（所得税法231条2項・同施行令356条）。同意がない人には紙で渡してください。</p>` : ''}`).join('')}
      <label class="field">表示の色<input id="f_color" type="color" value="${st.color}"></label>
      <label class="check"><input type="checkbox" id="f_active" ${st.active ? 'checked' : ''}> 在籍中</label>
      <label class="field wide">メモ（管理者だけが見られます）<textarea id="f_note" rows="2">${U.esc(st.note)}</textarea></label></form>`;
    UI.modal(isNew ? '従業員を追加' : `${st.name} さんの情報`, html, [
      { label: 'やめる' },
      { label: '保存する', kind: 'primary', onClick: w => {
        const v = id => w.querySelector('#f_' + id), err = w.querySelector('#f_err');
        w.querySelectorAll('.bad-input').forEach(x => x.classList.remove('bad-input'));
        const fail = (msg, id) => { err.textContent = msg; if (id) { v(id).classList.add('bad-input'); v(id).focus({ preventScroll: true }); } w.querySelector('.modal-body').scrollTop = 0; return false; };
        const name = v('name').value.trim(), wage = Number(v('wage').value || 0), pin = v('pin').value.trim(), email = v('email').value.trim();
        if (!name) return fail('氏名を入れてください。', 'name');
        if (S.get().staff.some(x => x.name === name && x.id !== st.id)) return fail('同じ氏名の人がいます。従業員ページのログインで区別できるよう、名前の書き方を変えてください（例：山田 花子（夜））。', 'name');
        if (!wage) return fail('時給を入れてください。', 'wage');
        if (wage < s.minWage) return fail(`時給が最低賃金（${s.minWagePref} ${U.yen(s.minWage)}）より低くなっています（最低賃金法4条）。`, 'wage');
        if (!/^[0-9]{4}$/.test(pin)) return fail('暗証番号は数字4桁で入れてください。', 'pin');
        if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return fail('メールアドレスの形が正しくありません。', 'email');
        if (v('consent').checked && !email) return fail('電子交付に同意している場合は、メールアドレスを入れてください。', 'email');
        if (v('consent').checked && !v('consentDate').value) return fail('同意した日を入れてください（同意の記録として残します）。', 'consentDate');
        if (!v('active').checked && !v('retireDate').value && !v('deathDate').value) return fail('在籍中を外すときは、退職年月日を入れてください（労働者名簿の記入事項）。', 'retireDate');
        const before = JSON.stringify({ wage: st.wage, active: st.active });
        ALL.forEach(([k, , t]) => { st[k] = t === 'number' ? Number(v(k).value || 0) : v(k).value.trim(); });
        st.color = v('color').value; st.empIns = v('empIns').checked; st.active = v('active').checked; st.note = v('note').value; st.consent = v('consent').checked;
        const d = S.get(); if (isNew) d.staff.push(st);
        S.log('管理者', isNew ? '従業員を追加' : '従業員情報を変更', st.name, isNew ? '' : `変更前 ${before}`);
        S.save();
        const miss = ALL.filter(f => f[3] === 'law' && ['gender', 'birth', 'address', 'hireDate'].includes(f[0]) && !st[f[0]]).map(f => f[1]);
        UI.toast(`${isNew ? '登録' : '保存'}しました${miss.length ? `（労働者名簿の未記入：${miss.join('・')}）` : ''}`); Admin.refresh();
      } },
    ]);

        <td>${miss.length ? `<span class="chip bad" title="${U.esc(miss.join('、'))}">未記入 ${miss.length}項目</span>` : '<span class="chip good">そろっています</span>'}</td>
        <td>${x.active ? '<span class="chip good">在籍</span>' : `<span class="chip">退職 ${U.esc(x.retireDate)}</span>`}</td></tr>`;
      }).join('')}</tbody></table></div>
      <p class="muted small">労働者名簿は、退職・死亡の日から5年間（当分の間は3年間）保存する義務があります（労働基準法109条・143条）。生年月日・住所・メールアドレスなどの個人情報は管理者ページだけに表示し、従業員ページには氏名だけを出します。</p></section>`);
      card.querySelectorAll('tr[data-id]').forEach(tr => {

        <label class="field">時間外の割増率（25%以上）<input id="c_otRate" type="number" step="0.01" min="1.25" value="${s.otRate}"></label>
        <label class="field">月60時間超の割増率（50%以上）<input id="c_ot60Rate" type="number" step="0.01" min="1.5" value="${s.ot60Rate}"></label>
        <label class="field">深夜（22〜5時）の割増率（25%以上）<input id="c_nightRate" type="number" step="0.01" min="1.25" value="${s.nightRate}"></label>
        <label class="check wide"><input type="checkbox" id="c_agreement36" ${s.agreement36 ? 'checked' : ''}> 36協定（時間外・休日労働に関する協定）を労働基準監督署に届け出ている</label>
        <label class="field">36協定：月の上限（時間）<input id="c_limitMonth" type="number" min="0" max="45" value="${s.limitMonth}"></label>
        <label class="field">36協定：年の上限（時間）<input id="c_limitYear" type="number" min="0" max="360" value="${s.limitYear}"></label>

        <h3 class="wide form-sec">最低賃金・雇用保険</h3>
        <label class="field">最低賃金の都道府県<input id="c_minWagePref" value="${U.esc(s.minWagePref)}"></label>
        <label class="field">地域別最低賃金（時間額・円）<input id="c_minWage" type="number" min="0" value="${s.minWage}"></label>
        <label class="field wide">最低賃金のメモ<input id="c_minWageNote" value="${U.esc(s.minWageNote)}"></label>
        <label class="field">雇用保険料率（労働者負担）<input id="c_empInsRate" type="number" step="0.0001" min="0" value="${s.empInsRate}"></label>
        <label class="field wide">雇用保険料率のメモ<input id="c_empInsNote" value="${U.esc(s.empInsNote)}"></label>

        <h3 class="wide form-sec">源泉所得税（月額表・電算機計算の特例）</h3>
        <p class="wide notice">今の数値：${U.esc(t.version)}。令和8年分（2026年1月以降の支払い）から税額表が改正されています。本番で使う前に、国税庁の最新の「源泉徴収税額表」で必ず確認してください。</p>
        <label class="field">甲欄：この金額未満は0円<input id="t_zeroBelow" type="number" value="${t.zeroBelow}"></label>
        <label class="field">基礎控除（月額）<input id="t_kiso" type="number" value="${t.kiso}"></label>
        <label class="field">扶養1人あたりの控除（月額）<input id="t_fuyo" type="number" value="${t.fuyo}"></label>
        <label class="field">乙欄：一律の率<input id="t_otsuRate" type="number" step="0.00001" value="${t.otsuRate}"></label>
        <details class="wide"><summary>詳しい人向け：給与所得控除・税率の表を直接直す</summary><label class="field">表のデータ（上限がない行は null と書きます）<textarea id="t_tables" rows="5" class="mono">${U.esc(JSON.stringify({ kyuyo: tbl(t.kyuyo), brackets: tbl(t.brackets) }))}</textarea></label></details>
        <p class="wide err" id="c_err" role="alert"></p>
        <div class="wide row-end"><button type="button" class="btn" id="taxReset">税の数値を初期値に戻す</button><button class="btn primary">設定を保存</button></div>
      </form></section>`);
      card.querySelector('form').onsubmit = e => {
        e.preventDefault();
        const v = id => card.querySelector('#' + id).value, err = card.querySelector('#c_err');
        let tb; try { tb = JSON.parse(v('t_tables')); if (!Array.isArray(tb.kyuyo) || !Array.isArray(tb.brackets)) throw 0; } catch (x) { err.textContent = '税の表の書き方が正しくありません。JSONの形を確認してください。'; return; }
        if (Number(v('c_otRate')) < 1.25 || Number(v('c_nightRate')) < 1.25 || Number(v('c_ot60Rate')) < 1.5) { err.textContent = '割増率が法律の下限（時間外・深夜25%、月60時間超50%）より低くなっています。'; return; }
        t.kyuyo = tb.kyuyo; t.brackets = tb.brackets;
        ['storeName', 'employer', 'minWagePref', 'minWageNote', 'empInsNote', 'adminPin'].forEach(k => { s[k] = v('c_' + k).trim(); });
        ['openHour', 'closeHour', 'step', 'need', 'otRate', 'ot60Rate', 'nightRate', 'weekStart', 'empInsRate', 'payDay', 'laborTarget', 'minWage', 'limitMonth', 'limitYear'].forEach(k => { s[k] = Number(v('c_' + k)); });
        s.agreement36 = card.querySelector('#c_agreement36').checked;
        ['zeroBelow', 'kiso', 'fuyo', 'otsuRate'].forEach(k => { t[k] = Number(v('t_' + k)); });
        t.version = '手動で更新（' + U.today() + '）';
        S.log('管理者', '設定を変更', '設定', '');
        S.save(); UI.toast('設定を保存しました'); Admin.refresh();
      };
      card.querySelector('#taxReset').onclick = () => { s.tax = App.defaultTax(); S.save(); UI.toast('税の数値を初期値に戻しました'); Admin.refresh(); };
      main.append(card);

      const data = UI.el(`<section class="card"><h2>データのバックアップ</h2>
        <p class="muted">試作版では、データはこの端末のブラウザの中に保存されています。下の文字をコピーして保存しておくと、あとで貼り付けて元に戻せます。中身には個人情報が含まれるので、保管場所に気をつけてください。</p>
        <textarea id="bk" rows="4" class="mono" readonly></textarea>
        <div class="row-end"><button class="btn" id="bkMake">今のデータを表示</button><button class="btn" id="bkCopy">コピー</button></div>
        <label class="field wide">復元するデータを貼り付け<textarea id="rs" rows="3" class="mono"></textarea></label>
        <div class="row-end"><button class="btn" id="rsDo">貼り付けたデータで置き換える</button><button class="btn danger" id="reset">見本データに作り直す</button></div></section>`);
      const bk = data.querySelector('#bk');
      data.querySelector('#bkMake').onclick = () => { bk.value = JSON.stringify(S.get()); };
      data.querySelector('#bkCopy').onclick = () => {
        if (!bk.value) bk.value = JSON.stringify(S.get());
        navigator.clipboard.writeText(bk.value).then(() => UI.toast('コピーしました'), () => { bk.select(); UI.toast('選択しました。Ctrl+C（スマホは長押し）でコピーしてください'); });
      };
      data.querySelector('#rsDo').onclick = async () => {
        let nd; try { nd = JSON.parse(data.querySelector('#rs').value); if (!nd.staff || !nd.settings) throw 0; } catch (e) { UI.toast('データの形が正しくありません'); return; }
        if (await UI.confirm('今のデータを、貼り付けたデータで置き換えます。', '置き換える', true)) { S.replace(nd); UI.toast('置き換えました'); Admin.refresh(); }
      };
      data.querySelector('#reset').onclick = async () => {
        if (await UI.confirm('今のデータをすべて消して、見本データを作り直します。', '作り直す', true)) { S.reset(); UI.toast('見本データを作り直しました'); Admin.refresh(); }
      };
      main.append(data);
    },
  });
})();

</script>
<script>
/* ---- js/admin-datamap.js ---- */
/* ミセカン 管理者ページ：データの入力と流れ
 * すべてのデータについて「誰が・どこで入力し・どの画面で使われるか」を1枚にまとめます。
 */
'use strict';
(function () {
  const U = App.U, UI = App.UI, S = App.Store, Admin = App.Admin;
  Admin.register({
    id: 'datamap', label: 'データの入力と流れ', group: 'ホーム',
    lead: '画面に出ている数字は、すべてこの表のどこかで入力したデータから計算しています。入力する場所がわからないときは、ここから開いてください。',
    render(main) {
      const d = S.get(), today = U.today();
      const last = (arr, f) => arr.length ? arr.map(f).sort().pop() : '';
      const days = d.sales.length, pDays = new Set(d.purchases.map(p => p.date)).size;
      const rows = [
        ['売上（1日のレジ締めの合計・客数）', '管理者', 'sales', '毎日の売上', 'ホーム、毎日の売上のグラフ、人件費率', `${days}日分`, last(d.sales, x => x.date)],
        ['商品ごとの販売記録（購買履歴）', '管理者', 'purchases', '購買履歴・ランキング', '商品・カテゴリ・会員ランキング、売上との差の確認', `${d.purchases.length}件（${pDays}日分）`, last(d.purchases, x => x.date)],
        ['商品マスタ（商品名・カテゴリ・単価）', '管理者', 'purchases', '購買履歴・ランキング（商品マスタ）', '販売記録の入力欄', `${d.items.length}品`, ''],
        ['従業員（労働者名簿・時給・保険・税・連絡先・暗証番号）', '管理者', 'staff', '従業員名簿', '給与計算、シフト、法令チェック、メール、従業員ページのログイン', `${d.staff.length}人`, ''],
        ['シフト希望', '従業員', 'staffpage', '従業員ページ「シフト」→「希望を出す」', 'シフト（✓で承認・✕で却下）', `未承認 ${d.requests.filter(r => r.status === 'pending').length}件`, last(d.requests, x => x.createdAt.slice(0, 10))],
        ['シフト（確定）', '管理者', 'shift', 'シフト', '1日の階段表、従業員ページ「シフト」、人件費（予定）、メール', `${d.shifts.filter(x => x.date >= today).length}件（今日以降）`, ''],
        ['打刻（出勤・休憩・退勤）', '従業員（直すのは管理者）', 'attendance', '従業員ページ「打刻」／勤怠・打刻（手入力・修正）', '勤怠の集計、給与計算、法令チェック、ホームの出勤状況', `${d.punches.length}件`, last(d.punches, x => x.date)],
        ['給与（確定）', '管理者', 'payroll', '給与計算で「確定」', '給与明細、賃金台帳、源泉徴収、従業員ページ「給与明細」、メール', `${d.payrolls.length}件`, last(d.payrolls, x => x.ym)],
        ['お知らせ', '管理者', 'board', '掲示板', '従業員ページ「掲示板」', `${d.posts.length}件`, last(d.posts, x => x.createdAt.slice(0, 10))],
        ['既読・リアクション', '従業員', 'staffpage', '従業員ページ「掲示板」', '掲示板（読んだ人・まだの人・押した人）', `既読 ${d.reads.length}件・リアクション ${d.reactions.length}件`, ''],
        ['設定（最低賃金・割増率・36協定・保険料率・税・暗証番号）', '管理者', 'config', '設定・データ', '給与計算、法令チェック、ログイン', '−', ''],
        ['メール配信の設定', '管理者', 'mail', 'メール配信', '月1回のメール（試作では送信しない）', `記録 ${d.mailLog.length}件`, ''],
        ['修正の記録', '自動で残る', 'attendance', '勤怠・打刻（下の「修正の記録」）', '労働時間の記録の確認', `${d.auditLog.length}件`, last(d.auditLog, x => x.at.slice(0, 10))],
      ];
      main.append(UI.el(`<section class="card"><div class="scroll"><table class="tbl datamap"><thead><tr><th>データ</th><th>入力する人</th><th>入力する場所</th><th>使われる画面</th><th class="r">件数</th><th>最新</th><th></th></tr></thead><tbody>${rows.map(([what, who, tab, where, used, n, lastDate]) => `<tr>
        <td><b>${what}</b></td><td class="nowrap"><span class="chip ${who.startsWith('従業員') ? 'info' : who === '管理者' ? 'good' : ''}">${who}</span></td><td>${where}</td><td class="small">${used}</td><td class="r nowrap">${n}</td><td class="nowrap small">${lastDate ? U.esc(lastDate) : '−'}</td>
        <td>${tab === 'staffpage' ? '<a class="btn sm" href="misekan-staff.html">従業員ページ</a>' : `<a class="btn sm primary" href="#${tab}">${who === '管理者' ? '入力する' : '開く'}</a>`}</td></tr>`).join('')}</tbody></table></div></section>`));
      main.append(UI.el(`<section class="card"><h2>データの流れ</h2><ol class="flow">
        <li><b>毎日</b>：従業員が従業員ページで<b>打刻</b>する → 管理者は「勤怠・打刻」で確認し、打刻もれを理由つきで直す。閉店後に管理者が「毎日の売上」に<b>レジ締めの合計</b>を入力し、「購買履歴」に<b>商品ごとの販売数</b>を入力する。</li>
        <li><b>週ごと</b>：従業員が従業員ページで<b>シフト希望</b>を出す → 管理者が「シフト」で承認・調整して<b>シフトを確定</b> → 従業員ページに表示される。</li>
        <li><b>月末</b>：締め日を過ぎたら、管理者が「給与計算」で内容を確かめて<b>確定</b> → 給与明細・賃金台帳・源泉徴収に反映 → 従業員ページの「給与明細」に表示される（メールは送信日を決めたあとに対応）。</li>
        <li><b>いつでも</b>：管理者が「掲示板」でお知らせを書く → 従業員が読む・リアクションする → 管理者は誰が読んだかを確認できる。</li>
      </ol></section>`));
    },
  });
})();

</script>
<script>
/* ---- js/admin-legal.js ---- */
/* ミセカン 管理者ページ：法令チェック
 * データを見て、法律上の対応が必要なところを自動で見つけます。
 * ここに出ないから問題がない、とは限りません。最終的な判断は社会保険労務士・税理士に確認してください。
 */
'use strict';
(function () {
  const U = App.U, UI = App.UI, S = App.Store, Admin = App.Admin;

  const Legal = App.Legal = {};
  Legal.issues = function (d) {
    const s = d.settings, today = U.today(), ym = U.ym(today), out = [];
    const add = (level, title, detail, law, tab) => out.push({ level, title, detail, law, tab });
    const active = d.staff.filter(x => x.active);
    const months = [U.ymAdd(ym, -1), ym];

    // 最低賃金
    active.filter(x => x.wage < s.minWage).forEach(x => add('bad', `${x.name} さんの時給が最低賃金より低い`, `時給 ${U.yen(x.wage)} ／ ${s.minWagePref}の最低賃金 ${U.yen(s.minWage)}`, '最低賃金法4条', 'staff'));

    // 休憩
    d.punches.filter(p => months.includes(U.ym(p.date)) && App.Pay.breakShort(p)).forEach(p => {
      add('bad', `${S.staff(p.staffId)?.name} さん ${U.label(p.date)} の休憩が${App.Pay.breakShort(p)}分足りない`, `${p.in}〜${p.out} 休憩${p.breakMin}分`, '労働基準法34条', 'attendance');
    });

    // 時間外・36協定・年少者
    active.forEach(x => {
      months.forEach(m => {
        const md = U.monthDays(m);
        const dm = Object.entries(App.Pay.days(x.id, d, md[0], md[md.length - 1]));
        const ot = U.sum(dm, ([, v]) => v.ot);
        if (ot > 0 && !s.agreement36) add('bad', `${x.name} さん ${U.ymLabel(m)}に時間外労働 ${U.hm(ot)}（36協定なし）`, '36協定を届け出ていないと、1日8時間・週40時間を超えて働かせることはできません。', '労働基準法32条・36条', 'attendance');
        else if (ot > s.limitMonth * 60) add('bad', `${x.name} さん ${U.ymLabel(m)}の時間外労働 ${U.hm(ot)} が36協定の上限（月${s.limitMonth}時間）を超えている`, '', '労働基準法36条', 'attendance');
        else if (ot > s.limitMonth * 60 * 0.8) add('warn', `${x.name} さん ${U.ymLabel(m)}の時間外労働 ${U.hm(ot)}（上限の8割を超えた）`, '', '労働基準法36条', 'attendance');
        dm.forEach(([date, v]) => {
          const age = U.age(x.birth, date);
          if (age !== null && age < 18 && (v.night > 0 || v.ot > 0)) add('bad', `${x.name} さん（${age}歳）${U.label(date)} に${v.night ? '深夜（22時以降）' : ''}${v.night && v.ot ? 'と' : ''}${v.ot ? '時間外' : ''}の労働`, '18歳未満は、原則として深夜（22時〜翌5時）と時間外の労働ができません。', '労働基準法60条・61条', 'attendance');
        });
      });
      const y = today.slice(0, 4);
      const yOt = U.sum(Object.values(App.Pay.days(x.id, d, `${y}-01-01`, today)), v => v.ot);
      if (s.agreement36 && yOt > s.limitYear * 60) add('bad', `${x.name} さん ${y}年の時間外労働 ${U.hm(yOt)} が年の上限（${s.limitYear}時間）を超えている`, '1月1日から数えた概算です。36協定の起算日で確認してください。', '労働基準法36条', 'attendance');
      // 18歳未満の深夜シフト（予定）
      d.shifts.filter(sh => sh.staffId === x.id && sh.date >= today && U.toMin(sh.end) > 22 * 60).forEach(sh => {
        const age = U.age(x.birth, sh.date);
        if (age !== null && age < 18) add('bad', `${x.name} さん（${age}歳）${U.label(sh.date)} のシフトが22時を超えている`, `${sh.start}〜${sh.end}`, '労働基準法61条', 'shift');
      });
      // 労働者名簿の記入
      const need = [['name', '氏名'], ['gender', '性別'], ['birth', '生年月日'], ['address', '住所'], ['hireDate', '雇入れ年月日']].filter(([k]) => !x[k]).map(([, l]) => l);
      if (need.length) add('warn', `${x.name || '(名前なし)'} さんの労働者名簿に未記入の項目`, need.join('、'), '労働基準法107条', 'staff');
