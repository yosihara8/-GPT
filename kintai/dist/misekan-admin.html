      if (x.email && !x.consent) add('info', `${x.name} さんは給与明細の電子交付に同意していない`, 'メールでは給与明細を送らず、紙で渡してください。', '所得税法231条2項', 'mail');
    });

    // 打刻もれ
    d.punches.filter(p => p.in && !p.out && p.date < today).forEach(p => add('warn', `${S.staff(p.staffId)?.name} さん ${U.label(p.date)} の退勤の打刻がない`, '本人に確認して、理由を書いて修正してください。', '労働安全衛生法66条の8の3', 'attendance'));

    // 確定後の打刻修正
    d.payrolls.forEach(p => {
      const st = S.staff(p.staffId); if (!st) return;
      const live = App.Pay.month(st, p.ym, d);
      if (live.gross !== p.gross) add('warn', `${p.name} さん ${U.ymLabel(p.ym)}分：確定後に打刻が変わり、給与額が${U.yen(live.gross - p.gross)}ずれている`, '差額の精算が必要か確認してください。', '労働基準法24条（全額払い）', 'payroll');
    });

    // 数値の確認
    if (/要確認/.test(s.tax.version)) add('info', '源泉所得税の数値が令和8年分の税額表に合っているか確認が必要', s.tax.version, '所得税法185条', 'config');
    if (/要確認/.test(s.empInsNote)) add('info', '雇用保険料率が今年度の率か確認が必要', `${s.empInsRate}（${s.empInsNote}）`, '労働保険徴収法', 'config');
    if (/要確認/.test(s.minWageNote)) add('info', '最低賃金の額が今の額か確認が必要', `${s.minWagePref} ${U.yen(s.minWage)}（${s.minWageNote}）`, '最低賃金法', 'config');
    return out;
  };

  const COVER = [
    ['労働基準法15条', '労働条件の明示（労働条件通知書）', 'none', '試作版にはありません。雇い入れ時に書面などで渡してください。'],
    ['労働基準法24条', '賃金の支払い（全額・毎月1回以上・一定期日）', 'ok', '月末締め・毎月決まった給料日。控除は法令で決まったものだけ。'],
    ['労働基準法32条', '労働時間（1日8時間・1週40時間）', 'ok', '超えた分を時間外として計算。'],
    ['労働基準法34条', '休憩（6時間超45分・8時間超60分）', 'ok', '足りない日を表示。打刻の修正時も確認。'],
    ['労働基準法36条', '36協定と時間外労働の上限', 'ok', '協定の有無と月・年の上限を確認。'],
    ['労働基準法37条', '割増賃金（時間外25%・月60時間超50%・深夜25%）', 'part', '休日労働（35%）は試作版では未対応。'],
    ['労働基準法39条', '年次有給休暇・年次有給休暇管理簿', 'none', '試作版にはありません。次の段階で追加が必要です。'],
    ['労働基準法60・61条', '年少者（18歳未満）の時間外・深夜労働の禁止', 'ok', '生年月日から判定して表示。'],
    ['労働基準法107条', '労働者名簿', 'ok', '「従業員名簿」タブ。法定の項目に印。'],
    ['労働基準法108条', '賃金台帳', 'ok', '「賃金台帳」タブ。'],
    ['労働基準法109条', '記録の保存（5年・当分の間3年）', 'part', '退職者・打刻・確定給与は削除しない作り。試作版はこの端末にだけ保存されるため、バックアップが必要。'],
    ['労働安全衛生法66条の8の3', '労働時間の状況の把握（客観的な記録）', 'ok', '従業員ページの打刻。管理者の修正は理由つきで記録。'],
    ['最低賃金法4条', '最低賃金', 'ok', '最低賃金より低い時給は保存できません。'],
    ['所得税法183・185条', '源泉徴収（月額表）', 'part', '税額の数値は要確認。乙欄の10万5千円以上と年末調整は未対応。'],
    ['所得税法226条', '源泉徴収票', 'part', '下書きのみ。年末調整後の金額ではありません。'],
    ['所得税法231条', '給与支払明細書の交付（電子交付は本人の承諾が必要）', 'ok', '従業員ページとメールで交付。メールは同意した人だけ。'],
    ['雇用保険法・労働保険徴収法', '雇用保険料の控除', 'ok', '料率は年度ごとに確認が必要。'],
    ['健康保険法・厚生年金保険法', '社会保険料の控除（標準報酬月額）', 'part', '月額を手入力。等級の自動計算は未対応。'],
    ['地方税法', '住民税の特別徴収', 'none', '試作版にはありません。'],
    ['個人情報保護法', '従業員の個人情報の取り扱い', 'part', '従業員ページには本人のデータと同僚の氏名だけを表示。試作版は暗号化・ログイン管理が簡易なため、本番ではサーバー側で対策が必要。'],
  ];

  Admin.register({
    id: 'legal', label: '法令チェック', group: 'ホーム', lead: '労働時間・賃金・税・個人情報について、対応が必要なところを自動で探します。ここに出ないから問題がない、とは限りません。最終的な判断は社会保険労務士・税理士に確認してください。',
    badge() { return Legal.issues(S.get()).filter(i => i.level === 'bad').length; },
    render(main) {
      const list = Legal.issues(S.get());
      const n = l => list.filter(i => i.level === l).length;
      main.append(UI.el(`<section class="tiles">
        <div class="tile"><span class="tile-label">すぐ対応が必要</span><b class="tile-num">${n('bad')}<small> 件</small></b><span class="tile-sub">法令に反するおそれ</span></div>
        <div class="tile"><span class="tile-label">確認が必要</span><b class="tile-num">${n('warn')}<small> 件</small></b><span class="tile-sub">記録の不足・上限が近い</span></div>
        <div class="tile"><span class="tile-label">お知らせ</span><b class="tile-num">${n('info')}<small> 件</small></b><span class="tile-sub">数値の確認など</span></div></section>`));
      const lab = { bad: ['すぐ対応', 'chip bad'], warn: ['確認', 'chip warn'], info: ['お知らせ', 'chip'] };
      const order = { bad: 0, warn: 1, info: 2 };
      main.append(UI.el(`<section class="card"><h2>見つかったこと</h2><ul class="issues">${list.sort((a, b) => order[a.level] - order[b.level]).map(i => `<li class="issue ${i.level}"><span class="${lab[i.level][1]}">${lab[i.level][0]}</span><div><b>${U.esc(i.title)}</b>${i.detail ? `<p>${U.esc(i.detail)}</p>` : ''}<small class="muted">${U.esc(i.law)}</small></div><a class="btn sm" href="#${i.tab}">開く</a></li>`).join('') || '<li class="muted">今のデータでは、見つかったことはありません。</li>'}</ul></section>`));
      const st = { ok: ['対応', 'chip good'], part: ['一部対応', 'chip warn'], none: ['未対応', 'chip bad'] };
      main.append(UI.el(`<section class="card"><h2>法令ごとの対応状況（試作版）</h2><div class="scroll"><table class="tbl"><thead><tr><th>法令</th><th>内容</th><th>状況</th><th>この画面での扱い</th></tr></thead><tbody>${COVER.map(([law, what, s2, note]) => `<tr><td class="nowrap">${law}</td><td>${what}</td><td><span class="${st[s2][1]}">${st[s2][0]}</span></td><td class="small">${note}</td></tr>`).join('')}</tbody></table></div></section>`));
    },
  });
})();

</script>
<script>
/* ---- js/admin-shift.js ---- */
/* ミセカン 管理画面：シフト（週間で作成・1日の階段表）と勤怠 */
'use strict';
(function () {
  const U = App.U, UI = App.UI, S = App.Store, Admin = App.Admin;
  const st = { view: App.pref.get('shiftView', 'week'), week: U.monday(U.today()), date: U.today() };

  const times = () => { const s = S.get().settings; return U.timeOptions(s.openHour, s.closeHour, s.step); };
  const cost = sh => { const p = S.staff(sh.staffId); return p ? p.wage * (U.toMin(sh.end) - U.toMin(sh.start)) / 60 : 0; };
  const clash = (d, sid, date, start, end, skipId) => d.shifts.some(x => x.id !== skipId && x.staffId === sid && x.date === date && U.toMin(start) < U.toMin(x.end) && U.toMin(x.start) < U.toMin(end));

  function shiftModal(sh) {
    const d = S.get(), isNew = !sh.id, tl = times();
    const presets = [['09:00', '14:00'], ['10:00', '15:00'], ['12:00', '17:00'], ['14:00', '19:00'], ['17:00', '22:00'], ['09:00', '17:00'], ['13:00', '22:00']];
    const m = UI.modal(isNew ? 'シフトを追加' : 'シフトを変更', `<form class="form">
      <label class="field">名前<select id="m_staff">${U.options(d.staff.filter(s => s.active).map(s => [s.id, s.name]), sh.staffId)}</select></label>
      <label class="field">日付<input type="date" id="m_date" value="${sh.date}"></label>
      <label class="field">開始<select id="m_start">${U.options(tl.slice(0, -1), sh.start)}</select></label>
      <label class="field">終了<select id="m_end">${U.options(tl.slice(1), sh.end)}</select></label>
      <div class="wide chips">${presets.map(([a, b]) => `<button type="button" class="chip-btn" data-a="${a}" data-b="${b}">${U.short(a)}-${U.short(b)}</button>`).join('')}</div>
      <p class="wide err" id="m_err" role="alert"></p></form>`,
    [...(isNew ? [] : [{ label: '削除', kind: 'danger', onClick: () => { d.shifts = d.shifts.filter(x => x.id !== sh.id); S.save(); UI.toast('シフトを削除しました'); Admin.refresh(); } }]),
      { label: 'やめる' },
      { label: '保存する', kind: 'primary', onClick: w => {
        const v = id => w.querySelector('#' + id).value;
        const n = { staffId: v('m_staff'), date: v('m_date'), start: v('m_start'), end: v('m_end') };
        const err = w.querySelector('#m_err');
        if (U.toMin(n.end) <= U.toMin(n.start)) { err.textContent = '終了は開始より後にしてください'; return false; }
        if (clash(d, n.staffId, n.date, n.start, n.end, sh.id)) { err.textContent = 'この人は同じ日に時間が重なるシフトがあります'; return false; }
        if (isNew) d.shifts.push(Object.assign({ id: U.uid() }, n)); else Object.assign(d.shifts.find(x => x.id === sh.id), n);
        S.save(); UI.toast('シフトを保存しました'); Admin.refresh();
      } }]);
    m.el.querySelectorAll('[data-a]').forEach(b => { b.onclick = () => { m.el.querySelector('#m_start').value = b.dataset.a; m.el.querySelector('#m_end').value = b.dataset.b; }; });
  }

  function approve(r) {
    const d = S.get();
    if (clash(d, r.staffId, r.date, r.start, r.end)) return false;
    r.status = 'approved';
    d.shifts.push({ id: U.uid(), staffId: r.staffId, date: r.date, start: r.start, end: r.end, fromRequest: r.id });
    return true;
  }

  /* ---------- 週間（作成） ---------- */
  function weekView(main) {
    const d = S.get(), days = [...Array(7)].map((_, i) => U.addDays(st.week, i)), today = U.today();
    const staff = d.staff.filter(s => s.active);
    const reqs = d.requests.filter(r => r.status === 'pending' && r.date >= days[0] && r.date <= days[6]);
    const bar = UI.el(`<div class="toolbar"></div>`);
    bar.append(UI.stepper(`${U.label(days[0])} 〜 ${U.label(days[6])}`, () => { st.week = U.addDays(st.week, -7); Admin.refresh(); }, () => { st.week = U.addDays(st.week, 7); Admin.refresh(); }));
    const btns = UI.el(`<div class="toolbar-r" data-input><button class="btn sm primary" id="wAdd">＋ シフトを追加</button><button class="btn sm" id="thisW">今週</button><button class="btn sm primary" id="apAll" ${reqs.length ? '' : 'disabled'}>この週の希望をまとめて承認（${reqs.length}件）</button></div>`);
    btns.querySelector('#thisW').onclick = () => { st.week = U.monday(U.today()); Admin.refresh(); };
    btns.querySelector('#wAdd').onclick = () => shiftModal({ staffId: staff[0]?.id, date: days[0] < U.today() ? U.today() : days[0], start: '09:00', end: '14:00' });
    btns.querySelector('#apAll').onclick = async () => {
      if (!await UI.confirm(`${reqs.length}件の希望をシフトとして確定します。時間が重なるものは承認しません。`, '承認する')) return;
      let ok = 0; reqs.forEach(r => { if (approve(r)) ok++; }); S.save(); UI.toast(`${ok}件を承認しました${ok < reqs.length ? `（${reqs.length - ok}件は時間が重なるため保留）` : ''}`); Admin.refresh();
    };
    bar.append(btns); main.append(bar);

    let html = `<table class="tbl week"><thead><tr><th>名前</th>${days.map(x => `<th class="${x === today ? 'today' : ''}"><button class="link ${U.wdClass(x)}" data-day="${x}">${U.label(x)}</button></th>`).join('')}<th class="r">週の時間</th></tr></thead><tbody>`;
    staff.forEach(p => {
      let min = 0;
      html += `<tr><td class="nowrap"><i class="dot" style="background:${p.color}"></i>${U.esc(p.name)}</td>`;
      days.forEach(x => {
        const ss = d.shifts.filter(s => s.staffId === p.id && s.date === x).sort((a, b) => U.toMin(a.start) - U.toMin(b.start));
        const rr = reqs.filter(r => r.staffId === p.id && r.date === x);
        ss.forEach(s => { min += U.toMin(s.end) - U.toMin(s.start); });
        html += `<td class="cell ${x === today ? 'today' : ''}" data-add="${p.id}|${x}">${ss.map(s => `<button class="tag" style="--c:${p.color}" data-shift="${s.id}">${U.short(s.start)}-${U.short(s.end)}</button>`).join('')}${rr.map(r => `<span class="tag req" title="${U.esc(r.note || 'シフト希望')}">希望 ${U.short(r.start)}-${U.short(r.end)}<button class="mini ok" data-ok="${r.id}" aria-label="承認">✓</button><button class="mini ng" data-ng="${r.id}" aria-label="却下">✕</button></span>`).join('')}${!ss.length && !rr.length ? '<span class="add">＋</span>' : ''}</td>`;
      });
      html += `<td class="r mono">${U.hm(min)}</td></tr>`;
    });
    html += `</tbody><tfoot><tr><td>出勤人数</td>${days.map(x => `<td class="${x === today ? 'today' : ''}">${new Set(d.shifts.filter(s => s.date === x).map(s => s.staffId)).size}人</td>`).join('')}<td></td></tr>
      <tr><td>人件費（予定）</td>${days.map(x => `<td class="mono ${x === today ? 'today' : ''}">${U.yen(U.sum(d.shifts.filter(s => s.date === x), cost))}</td>`).join('')}<td class="r mono">${U.yen(U.sum(d.shifts.filter(s => s.date >= days[0] && s.date <= days[6]), cost))}</td></tr></tfoot></table>`;
    const card = UI.el(`<section class="card"><p class="muted small">点線の「希望」は従業員ページから出されたシフト希望です。✓で確定、✕で却下。空いているマスを押すとシフトを追加、色のついたシフトを押すと変更できます。日付を押すとその日の階段表を開きます。</p><div class="scroll">${html}</div></section>`);
    card.onclick = e => {
      const t = e.target;
      if (t.dataset.day) { st.date = t.dataset.day; st.view = 'day'; Admin.refresh(); return; }
      if (t.dataset.ok) { const r = d.requests.find(x => x.id === t.dataset.ok); if (approve(r)) { S.save(); UI.toast('承認しました'); } else UI.toast('同じ日に時間が重なるシフトがあるため承認できません'); Admin.refresh(); return; }
      if (t.dataset.ng) { d.requests.find(x => x.id === t.dataset.ng).status = 'rejected'; S.save(); UI.toast('却下しました'); Admin.refresh(); return; }
      if (t.dataset.shift) { shiftModal(d.shifts.find(x => x.id === t.dataset.shift)); return; }
      const cell = t.closest('[data-add]');
      if (cell && (t === cell || t.classList.contains('add'))) { const [sid, date] = cell.dataset.add.split('|'); shiftModal({ staffId: sid, date, start: '09:00', end: '14:00' }); }
    };
    main.append(card);
  }

  /* ---------- 1日（階段表） ---------- */
  function dayView(main) {
    const d = S.get(), s = d.settings, date = st.date;
    const need = +App.pref.get('need', s.need);
    const bar = UI.el(`<div class="toolbar"></div>`);
    bar.append(UI.stepper(`<span class="${U.wdClass(date)}">${U.label(date)}</span>`, () => { st.date = U.addDays(date, -1); Admin.refresh(); }, () => { st.date = U.addDays(date, 1); Admin.refresh(); }));
    const r = UI.el(`<div class="toolbar-r" data-input><input type="date" id="dPick" value="${date}" aria-label="日付"><button class="btn sm" id="dToday">今日</button><label class="inline">必要人数 <input type="number" id="dNeed" min="0" max="20" value="${need}"></label><button class="btn sm primary" id="dAdd">＋ シフト追加</button></div>`);
    r.querySelector('#dPick').onchange = e => { if (e.target.value) { st.date = e.target.value; Admin.refresh(); } };
    r.querySelector('#dToday').onclick = () => { st.date = U.today(); Admin.refresh(); };
    r.querySelector('#dNeed').onchange = e => { App.pref.set('need', e.target.value); Admin.refresh(); };
    r.querySelector('#dAdd').onclick = () => shiftModal({ staffId: d.staff[0]?.id, date, start: '09:00', end: '14:00' });
    bar.append(r); main.append(bar);

    const open = s.openHour * 60, slots = (s.closeHour - s.openHour) * 60 / s.step, per = 60 / s.step;
    const list = d.shifts.filter(x => x.date === date).sort((a, b) => U.toMin(a.start) - U.toMin(b.start) || U.toMin(a.end) - U.toMin(b.end));
    const count = new Array(slots).fill(0);
    let h = `<table class="gantt"><colgroup><col class="g-name"><col class="g-time">${'<col>'.repeat(slots)}</colgroup><thead><tr><th>名前</th><th>時間</th>`;
    for (let x = s.openHour; x < s.closeHour; x++) h += `<th colspan="${per}">${x}</th>`;
    h += `</tr></thead><tbody>`;
    const cell = i => `<td class="slot ${i % per === 0 ? 'hour' : ''}"></td>`;
    list.forEach(x => {
      const p = S.staff(x.staffId) || { name: '(削除済み)', color: '#888' };
      const a = Math.max(0, (U.toMin(x.start) - open) / s.step), b = Math.min(slots, (U.toMin(x.end) - open) / s.step);
      for (let i = a; i < b; i++) count[i]++;
      const pu = d.punches.find(q => q.staffId === x.staffId && q.date === date);
      h += `<tr><td class="nowrap"><i class="dot" style="background:${p.color}"></i>${U.esc(p.name)}</td><td class="mono">${U.short(x.start)}-${U.short(x.end)}</td>`;
      for (let i = 0; i < a; i++) h += cell(i);
      h += `<td class="bar" colspan="${b - a}"><button style="--c:${p.color}" data-shift="${x.id}">${U.short(x.start)}-${U.short(x.end)}${pu && pu.in ? ` <small>打刻 ${pu.in}${pu.out ? '〜' + pu.out : '〜'}</small>` : ''}</button></td>`;
      for (let i = b; i < slots; i++) h += cell(i);
      h += `</tr>`;
    });
    if (!list.length) h += `<tr><td colspan="${slots + 2}" class="muted center">この日のシフトはまだありません</td></tr>`;
    h += `</tbody><tfoot><tr><td colspan="2">人数</td>${count.map(c => `<td class="${c < need ? 'lack' : ''}">${c}</td>`).join('')}</tr></tfoot></table>`;
    const lack = count.filter(c => c < need).length * s.step / 60;
    const card = UI.el(`<section class="card"><div class="scroll">${h}</div>
      <p class="sumline">出勤 <b>${new Set(list.map(x => x.staffId)).size}人</b> ・ 合計 <b>${U.hm(U.sum(list, x => U.toMin(x.end) - U.toMin(x.start)))}</b> ・ 人件費（予定） <b>${U.yen(U.sum(list, cost))}</b>${need ? ` ・ ${lack ? `<span class="chip bad">人が足りない時間 ${lack}時間分</span>` : '<span class="chip good">必要人数を満たしています</span>'}` : ''}</p></section>`);
    card.onclick = e => { const b = e.target.closest('[data-shift]'); if (b) shiftModal(d.shifts.find(x => x.id === b.dataset.shift)); };
    main.append(card);
  }

  Admin.register({
    id: 'shift', label: 'シフト', group: '現場', lead: '従業員の希望を承認してシフトを作ります。1日の表は営業時間に沿った階段状で表示します。',
    badge() { return S.get().requests.filter(r => r.status === 'pending').length; },
    render(main) {
      const seg = UI.el(`<div class="seg" role="tablist"><button data-v="week" role="tab">週間・作成</button><button data-v="day" role="tab">1日の階段表</button></div>`);
      seg.querySelectorAll('button').forEach(b => {
        b.setAttribute('aria-selected', b.dataset.v === st.view);
        b.onclick = () => { st.view = b.dataset.v; App.pref.set('shiftView', st.view); Admin.refresh(); };
      });
      main.append(seg);
      (st.view === 'day' ? dayView : weekView)(main);
    },
  });

  /* ================= 勤怠・打刻 ================= */
  const at = { ym: U.ym(U.today()), staff: '' };
  function punchModal(p, isNew) {
    const d = S.get();
    UI.modal(isNew ? '打刻を手入力' : '打刻を修正', `<form class="form">
      <label class="field">名前<select id="q_staff" ${isNew ? '' : 'disabled'}>${U.options(d.staff.map(s => [s.id, s.name]), p.staffId)}</select></label>
      <label class="field">日付<input type="date" id="q_date" value="${p.date}" ${isNew ? '' : 'disabled'}></label>
      <label class="field">出勤<input type="time" id="q_in" value="${p.in}" required></label>
      <label class="field">退勤<input type="time" id="q_out" value="${p.out}"></label>
      <label class="field">休憩（分）<input type="number" id="q_brk" min="0" step="5" value="${p.breakMin || 0}"></label>
      <label class="field wide">修正・手入力の理由 <span class="req">必須</span><input id="q_note" required placeholder="例：退勤の打刻忘れ（本人に確認済み）"></label>
      <p class="wide small muted">労働時間は客観的な記録で把握し、直すときは理由を残す必要があります（労働安全衛生法66条の8の3、厚生労働省「労働時間の適正な把握のためのガイドライン」）。直した内容・理由・日時は「修正の記録」に残ります。実際に働いた時間より短く記録することは法令違反になります。</p>
      <p class="wide err" id="q_err" role="alert"></p></form>`,
    [...(isNew ? [] : [{ label: '削除', kind: 'danger', onClick: w => {
        const why = w.querySelector('#q_note').value.trim(), err = w.querySelector('#q_err');
        if (!why) { err.textContent = '削除する理由を入れてください。'; return false; }
        d.punches = d.punches.filter(x => x.id !== p.id);
        S.log('管理者', '打刻を削除', S.staff(p.staffId)?.name, `${p.date} ${p.in}〜${p.out || ''} 休憩${p.breakMin}分`, why);
        S.save(); Admin.refresh();
      } }]),
      { label: 'やめる' },
      { label: '保存する', kind: 'primary', onClick: w => {
        const f = w.querySelector('form'); if (!f.reportValidity()) return false;
        const v = id => w.querySelector('#' + id).value;
        const n = { in: v('q_in'), out: v('q_out'), breakMin: Number(v('q_brk')) || 0, note: v('q_note').trim(), edited: true, breakStart: '' };
        const err = w.querySelector('#q_err');
        if (!n.note) { err.textContent = '理由を入れてください。'; return false; }
        const short = App.Pay.breakShort(n);
        if (short) { err.textContent = `休憩が${short}分足りません。労働時間が6時間を超えると45分、8時間を超えると60分の休憩が必要です（労働基準法34条）。実際に休憩が少なかった場合は、休憩分も労働時間として扱われます。休憩を正しく入れ直してください。`; return false; }
        const who = S.staff(isNew ? v('q_staff') : p.staffId)?.name;
        const after = `${n.in}〜${n.out || '（未退勤）'} 休憩${n.breakMin}分`;
        if (isNew) {
          if (d.punches.some(x => x.staffId === v('q_staff') && x.date === v('q_date'))) { err.textContent = 'その日の打刻はすでにあります。一覧から修正してください。'; return false; }
          d.punches.push(Object.assign({ id: U.uid(), staffId: v('q_staff'), date: v('q_date') }, n));
          S.log('管理者', '打刻を手入力', who, `${v('q_date')} ${after}`, n.note);
        } else {
          S.log('管理者', '打刻を修正', who, `${p.date} 変更前 ${p.in}〜${p.out || '（未退勤）'} 休憩${p.breakMin}分 → 変更後 ${after}`, n.note);
          Object.assign(d.punches.find(x => x.id === p.id), n);
        }
        S.save(); UI.toast('打刻を保存しました'); Admin.refresh();
      } }]);
  }
  Admin.register({
    id: 'attendance', label: '勤怠・打刻', group: '現場', lead: '従業員ページの打刻がここに集まります。打刻忘れや遅刻を確認して修正できます。',
    badge() { const d = S.get(), t = U.today(); return d.punches.filter(p => p.in && !p.out && p.date < t).length; },
    render(main) {
      const d = S.get(), today = U.today(), ym = at.ym;
      const bar = UI.el(`<div class="toolbar"></div>`);
      bar.append(UI.stepper(U.ymLabel(ym), () => { at.ym = U.ymAdd(ym, -1); Admin.refresh(); }, () => { at.ym = U.ymAdd(ym, 1); Admin.refresh(); }));
      const r = UI.el(`<div class="toolbar-r" data-input><select id="aStaff" aria-label="従業員">${U.options([['', '全員'], ...d.staff.map(s => [s.id, s.name])], at.staff)}</select><button class="btn sm primary" id="aAdd">＋ 打刻を手入力</button></div>`);
      r.querySelector('#aStaff').onchange = e => { at.staff = e.target.value; Admin.refresh(); };
      r.querySelector('#aAdd').onclick = () => punchModal({ staffId: at.staff || d.staff[0].id, date: today, in: '09:00', out: '', breakMin: 0 }, true);
      bar.append(r); main.append(bar);

      const people = d.staff.filter(s => !at.staff || s.id === at.staff);
      // 集計
      const sum = UI.el(`<section class="card"><h2>${U.ymLabel(ym)}の集計</h2><div class="scroll"><table class="tbl"><thead><tr><th>名前</th><th class="r">出勤日数</th><th class="r">実働</th><th class="r">残業</th><th class="r">深夜</th><th class="r">遅刻</th><th class="r">休憩不足</th><th class="r">打刻もれ</th></tr></thead><tbody>${people.map(p => {
        const ps = d.punches.filter(x => x.staffId === p.id && x.date.startsWith(ym));
        const md = U.monthDays(ym), dm = Object.values(App.Pay.days(p.id, d, md[0], md[md.length - 1]));   // 週40時間超も含めて数える
        const w = U.sum(dm, x => x.work), o = U.sum(dm, x => x.ot), n = U.sum(dm, x => x.night);
        const brkNg = ps.filter(x => App.Pay.breakShort(x)).length;
        const late = ps.filter(x => { const sh = d.shifts.find(s => s.staffId === p.id && s.date === x.date); return sh && x.in && U.toMin(x.in) > U.toMin(sh.start); }).length;
        const miss = ps.filter(x => x.in && !x.out && x.date < today).length + d.shifts.filter(s => s.staffId === p.id && s.date.startsWith(ym) && s.date < today && !ps.some(x => x.date === s.date)).length;
        if (!ps.length && !miss) return '';
        return `<tr><td><i class="dot" style="background:${p.color}"></i>${U.esc(p.name)}</td><td class="r">${ps.filter(x => x.out).length}日</td><td class="r mono">${U.hm(w)}</td><td class="r mono">${U.hm(o)}</td><td class="r mono">${U.hm(n)}</td><td class="r">${late ? `<span class="chip warn">${late}回</span>` : '0回'}</td><td class="r">${brkNg ? `<span class="chip bad">${brkNg}日</span>` : '0日'}</td><td class="r">${miss ? `<span class="chip bad">${miss}件</span>` : '0件'}</td></tr>`;
      }).join('') || '<tr><td colspan="8" class="muted">この月の打刻はありません</td></tr>'}</tbody></table></div><p class="muted small">残業＝1日8時間または1週40時間（${U.WD[d.settings.weekStart]}曜はじまり）を超えた時間。深夜＝22時〜翌5時。出勤簿にあたる記録は5年間（当分の間は3年間）保存します（労働基準法109条）。</p></section>`);
      main.append(sum);

      // 明細
      const rows = [];
      U.monthDays(ym).forEach(date => people.forEach(p => {
        const pu = d.punches.find(x => x.staffId === p.id && x.date === date);
        const sh = d.shifts.find(x => x.staffId === p.id && x.date === date);
        if (!pu && !(sh && date <= today)) return;
        rows.push({ date, p, pu, sh });
      }));
      rows.reverse();
      const det = UI.el(`<section class="card"><h2>打刻の明細 <small class="muted">新しい順・行を押すと修正</small></h2><div class="scroll"><table class="tbl hover"><thead><tr><th>日付</th><th>名前</th><th>シフト</th><th>出勤</th><th>退勤</th><th class="r">休憩</th><th class="r">実働</th><th class="r">深夜</th><th>状態</th></tr></thead><tbody>${rows.map((x, i) => {
        const c = App.Pay.day(x.pu);
        let state;
        if (!x.pu) state = x.date === today ? Admin.punchState(null, x.sh, x.date) : ['打刻なし', 'chip bad'];
        else if (!x.pu.out) state = x.date < today ? ['退勤の打刻もれ', 'chip bad'] : Admin.punchState(x.pu, x.sh, x.date);
        else if (App.Pay.breakShort(x.pu)) state = [`休憩不足 ${App.Pay.breakShort(x.pu)}分`, 'chip bad'];
        else if (x.sh && U.toMin(x.pu.in) > U.toMin(x.sh.start)) state = ['遅刻', 'chip warn'];
        else if (x.sh && U.toMin(x.pu.out) < U.toMin(x.sh.end)) state = ['早退', 'chip warn'];
        else state = ['問題なし', 'chip good'];
        return `<tr data-i="${i}" tabindex="0"><td class="${U.wdClass(x.date)} nowrap">${U.label(x.date)}</td><td class="nowrap"><i class="dot" style="background:${x.p.color}"></i>${U.esc(x.p.name)}</td><td class="mono">${x.sh ? U.short(x.sh.start) + '-' + U.short(x.sh.end) : '−'}</td><td class="mono">${x.pu?.in || '−'}</td><td class="mono">${x.pu?.out || '−'}</td><td class="r mono">${x.pu ? x.pu.breakMin + '分' : '−'}</td><td class="r mono">${c ? U.hm(c.work) : '−'}</td><td class="r mono">${c && c.night ? U.hm(c.night) : '−'}</td><td><span class="${state[1]}">${state[0]}</span>${x.pu?.edited ? ' <span class="chip">修正済み</span>' : ''}</td></tr>`;
      }).join('') || '<tr><td colspan="9" class="muted">この月の打刻はありません</td></tr>'}</tbody></table></div></section>`);
      det.querySelectorAll('tr[data-i]').forEach(tr => {
        const open = () => { const x = rows[+tr.dataset.i]; x.pu ? punchModal(x.pu, false) : punchModal({ staffId: x.p.id, date: x.date, in: x.sh ? x.sh.start : '09:00', out: x.sh ? x.sh.end : '', breakMin: 0 }, true); };
        tr.onclick = open; tr.onkeydown = e => { if (e.key === 'Enter') open(); };
      });
      main.append(det);

      const logs = d.auditLog.filter(l => /打刻/.test(l.action) && l.actor === '管理者').slice().reverse();
      main.append(UI.el(`<section class="card"><h2>修正の記録 <small class="muted">管理者が直した・手入力した打刻（消すことはできません）</small></h2><div class="scroll"><table class="tbl"><thead><tr><th>日時</th><th>内容</th><th>対象</th><th>変更</th><th>理由</th></tr></thead><tbody>${logs.slice(0, 50).map(l => `<tr><td class="num nowrap">${l.at.replace('T', ' ').slice(0, 16)}</td><td class="nowrap">${U.esc(l.action)}</td><td class="nowrap">${U.esc(l.target)}</td><td>${U.esc(l.detail)}</td><td>${U.esc(l.reason)}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">修正はまだありません</td></tr>'}</tbody></table></div></section>`));
    },
  });
})();

</script>
<script>
/* ---- js/admin-pay.js ---- */
/* ミセカン 管理画面：給与計算・給与明細・源泉徴収 */
'use strict';
(function () {
  const U = App.U, UI = App.UI, S = App.Store, Admin = App.Admin;
  const ps = { ym: U.ymAdd(U.ym(U.today()), -1), slipYm: U.ymAdd(U.ym(U.today()), -1), slipStaff: '', year: new Date().getFullYear() };
  const confirmed = (d, ym, sid) => d.payrolls.find(p => p.ym === ym && p.staffId === sid);

  /* ================= 給与計算 ================= */
  Admin.register({
    id: 'payroll', label: '給与計算', group: '人事・給与', lead: '打刻をもとに月ごとの給与を計算します。内容を確認して「確定」すると、従業員ページに給与明細が届きます。',
    render(main) {
      const d = S.get(), ym = ps.ym;
      const bar = UI.el(`<div class="toolbar"></div>`);
      bar.append(UI.stepper(U.ymLabel(ym) + '分', () => { ps.ym = U.ymAdd(ym, -1); Admin.refresh(); }, () => { ps.ym = U.ymAdd(ym, 1); Admin.refresh(); }));
      const staff = d.staff.filter(s => s.active || d.punches.some(p => p.staffId === s.id && p.date.startsWith(ym)));
      const rows = staff.map(s => ({ s, live: App.Pay.month(s, ym, d), fixed: confirmed(d, ym, s.id) })).filter(r => r.live.days || r.fixed);
      const notYet = rows.filter(r => !r.fixed && r.live.days);
      const closed = U.monthDays(ym).pop() < U.today();   // 締め日（月末）を過ぎた月だけ確定できる
      const btn = UI.el(`<div class="toolbar-r"><span class="muted small">締め：月末 ・ 計算期間 ${U.label(ym + '-01')}〜${U.label(U.monthDays(ym).pop())}${closed ? '' : ' ・ <b>まだ締め日前のため確定できません</b>'}</span><button class="btn primary sm" ${notYet.length && closed ? '' : 'disabled'}>未確定の${notYet.length}人分を確定</button></div>`);
      btn.querySelector('button').onclick = async () => {
        const open = notYet.filter(r => r.live.openDays).length;
        if (!await UI.confirm(`${U.ymLabel(ym)}分の給与を${notYet.length}人分確定し、従業員ページに明細を届けます。${open ? `退勤の打刻もれがある人が${open}人います（その日は計算に入っていません）。` : ''}`, '確定する')) return;
        notYet.forEach(r => d.payrolls.push(Object.assign(r.live, { id: U.uid(), confirmedAt: new Date().toISOString() })));
        S.log('管理者', '給与を確定', `${U.ymLabel(ym)}分`, notYet.map(r => r.s.name).join('、'));
        S.save(); UI.toast('確定しました'); Admin.refresh();
      };
      bar.append(btn); main.append(bar);

      const list = rows.map(r => r.fixed || r.live);
      main.append(UI.el(`<section class="tiles">
        <div class="tile"><span class="tile-label">総支給額の合計</span><b class="tile-num">${U.yen(U.sum(list, p => p.gross))}</b><span class="tile-sub">${list.length}人分</span></div>
        <div class="tile"><span class="tile-label">差引支給額の合計（振込額）</span><b class="tile-num">${U.yen(U.sum(list, p => p.net))}</b><span class="tile-sub">支給日 ${U.label(App.Pay.payDate(ym, d.settings.payDay))}</span></div>
        <div class="tile"><span class="tile-label">預かる所得税（支給月の翌月10日までに納付）</span><b class="tile-num">${U.yen(U.sum(list, p => p.tax))}</b><span class="tile-sub">雇用保険料 ${U.yen(U.sum(list, p => p.empIns))}</span></div>
      </section>`));

      const card = UI.el(`<section class="card"><div class="scroll"><table class="tbl hover"><thead><tr><th>名前</th><th class="r">時給</th><th class="r">日数</th><th class="r">労働時間</th><th class="r">総支給</th><th class="r">雇用保険</th><th class="r">社会保険</th><th class="r">所得税</th><th class="r">差引支給</th><th>状態</th><th></th></tr></thead><tbody>${rows.map((r, i) => {
        const p = r.fixed || r.live, changed = r.fixed && r.fixed.gross !== r.live.gross;
        return `<tr><td class="nowrap"><i class="dot" style="background:${r.s.color}"></i>${U.esc(r.s.name)} <small class="muted">${r.s.taxCol}欄</small></td><td class="r mono">${U.yen(p.wage)}</td><td class="r">${p.days}</td><td class="r mono">${U.hm(p.workMin)}</td><td class="r mono">${U.yen(p.gross)}</td><td class="r mono">${U.yen(p.empIns)}</td><td class="r mono">${U.yen(p.social)}</td><td class="r mono">${U.yen(p.tax)}</td><td class="r mono"><b>${U.yen(p.net)}</b></td>
          <td class="nowrap">${r.fixed ? '<span class="chip good">確定済み</span>' : '<span class="chip warn">未確定</span>'}${changed ? ' <span class="chip bad" title="確定後に打刻が修正されました">打刻が変わっています</span>' : ''}${r.live.openDays ? ` <span class="chip bad">打刻もれ${r.live.openDays}</span>` : ''}</td>
          <td class="nowrap"><button class="btn sm" data-view="${i}">明細</button>${r.fixed ? ` <button class="btn sm" data-undo="${i}">確定を取り消す</button>` : ''}</td></tr>`;
      }).join('') || '<tr><td colspan="11" class="muted">この月の勤務はありません</td></tr>'}</tbody></table></div>
      <p class="muted small">計算方法：基本給＝時給×労働時間。時間外（1日8時間・1週40時間を超えた分）は時給×${(d.settings.otRate - 1).toFixed(2)}、月60時間を超えた分は×${(d.settings.ot60Rate - 1).toFixed(2)}、深夜（22〜5時）は×${(d.settings.nightRate - 1).toFixed(2)}を加算（労働基準法37条）。雇用保険料は総支給額×${d.settings.empInsRate}。所得税は社会保険料等を引いた額から計算。給与から引けるのは法令で決まったものだけで、それ以外を引くには労使協定が必要です（労働基準法24条）。</p></section>`);
      card.onclick = async e => {
        const t = e.target;
        if (t.dataset.view) { const r = rows[+t.dataset.view]; UI.modal('給与明細', App.payslipHtml(r.fixed || r.live, { employer: d.settings.employer, draft: !r.fixed })); }
        if (t.dataset.undo) {
          const r = rows[+t.dataset.undo];
          if (!await UI.confirm(`${r.s.name} さんの${U.ymLabel(ym)}分の確定を取り消します。従業員ページからこの明細が見えなくなります。`, '取り消す', true)) return;
          d.payrolls = d.payrolls.filter(x => x !== r.fixed);
          S.log('管理者', '給与の確定を取り消し', r.s.name, `${U.ymLabel(ym)}分`);
          S.save(); Admin.refresh();
        }
      };
      main.append(card);
    },
  });

  /* ================= 給与明細 ================= */
  Admin.register({
    id: 'payslip', label: '給与明細', group: '人事・給与', lead: '確定した給与明細を見られます。従業員ページには本人の分だけが届きます。',
    render(main) {
      const d = S.get();
      const months = [...new Set(d.payrolls.map(p => p.ym))].sort().reverse();
      if (!months.length) { main.append(UI.el(`<section class="card"><p class="muted">確定した給与はまだありません。「給与計算」タブで確定してください。</p></section>`)); return; }
      if (!months.includes(ps.slipYm)) ps.slipYm = months[0];
      const list = d.payrolls.filter(p => p.ym === ps.slipYm);
      if (!list.some(p => p.staffId === ps.slipStaff)) ps.slipStaff = list[0]?.staffId || '';
      const bar = UI.el(`<div class="toolbar"><select id="sYm" aria-label="月">${U.options(months.map(m => [m, U.ymLabel(m) + '分']), ps.slipYm)}</select><div class="pills">${list.map(p => `<button class="pill${p.staffId === ps.slipStaff ? ' on' : ''}" data-s="${p.staffId}">${U.esc(p.name)}</button>`).join('')}</div></div>`);
      bar.querySelector('#sYm').onchange = e => { ps.slipYm = e.target.value; Admin.refresh(); };
      bar.querySelectorAll('[data-s]').forEach(b => { b.onclick = () => { ps.slipStaff = b.dataset.s; Admin.refresh(); }; });
      main.append(bar);
      const p = list.find(x => x.staffId === ps.slipStaff);
      if (p) main.append(UI.el(`<section class="card">${App.payslipHtml(p, { employer: d.settings.employer })}<p class="muted small">確定日時 ${p.confirmedAt.slice(0, 16).replace('T', ' ')}</p></section>`));
    },
  });

  /* ================= 賃金台帳（労働基準法108条・施行規則54条） ================= */
  Admin.register({
    id: 'ledger', label: '賃金台帳', group: '人事・給与', lead: '労働基準法108条で作成が義務づけられている賃金台帳です。確定した給与から、1人ずつ1年分を作ります。',
    render(main) {
      const d = S.get(), y = ps.year;
      const bar = UI.el(`<div class="toolbar"></div>`);
      bar.append(UI.stepper(`${y}年（${U.wareki(y)}）`, () => { ps.year--; Admin.refresh(); }, () => { ps.year++; Admin.refresh(); }));
      main.append(bar);
      const list = d.payrolls.filter(p => p.ym.startsWith(String(y)));
      const people = d.staff.filter(s => list.some(p => p.staffId === s.id));
      if (!people.length) main.append(UI.el(`<section class="card"><p class="muted">この年の確定した給与はありません。</p></section>`));
      const rows = [['賃金計算期間', p => `${+p.periodStart.slice(5, 7)}/${+p.periodStart.slice(8)}〜${+p.periodEnd.slice(5, 7)}/${+p.periodEnd.slice(8)}`], ['支給日', p => U.label(p.payDate)],
        ['労働日数', p => p.days + '日'], ['労働時間数', p => U.hm(p.workMin)], ['時間外労働時間数', p => U.hm(p.otMin)], ['休日労働時間数', () => '0:00'], ['深夜労働時間数', p => U.hm(p.nightMin)],
        ['基本給', p => U.yen(p.base)], ['時間外労働手当', p => U.yen(p.otPay)], ['深夜労働手当', p => U.yen(p.nightPay)], ['通勤手当', p => U.yen(p.transport)], ['総支給額', p => U.yen(p.gross), 'total'],
        ['雇用保険料', p => U.yen(p.empIns)], ['社会保険料', p => U.yen(p.social)], ['所得税', p => U.yen(p.tax)], ['控除合計', p => U.yen(p.deductions)], ['差引支給額', p => U.yen(p.net), 'total']];
      people.forEach(s => {
        const ps2 = list.filter(p => p.staffId === s.id).sort((a, b) => a.ym.localeCompare(b.ym));
        main.append(UI.el(`<section class="card"><h2><i class="dot" style="background:${s.color}"></i>${U.esc(s.name)} <small class="muted">性別：${U.esc(s.gender || '未記入')} ・ ${U.esc(s.job || '')}</small></h2>
          <div class="scroll"><table class="tbl ledger"><thead><tr><th>項目</th>${ps2.map(p => `<th class="r">${+p.ym.slice(5)}月分</th>`).join('')}</tr></thead><tbody>${rows.map(([l, f, c]) => `<tr class="${c || ''}"><th>${l}</th>${ps2.map(p => `<td class="r num">${f(p)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`));
      });
      main.append(UI.el(`<p class="muted small">記入する項目：氏名、性別、賃金計算期間、労働日数、労働時間数、時間外・休日・深夜の労働時間数、基本給・手当などの種類ごとの額、控除の項目と額（労働基準法施行規則54条）。最後の記入の日から5年間（当分の間は3年間）保存します（同法109条）。休日労働（法定休日の労働）は試作版では記録していないため0:00と表示しています。</p>`));
    },
  });

  /* ================= 源泉徴収 ================= */
  Admin.register({
    id: 'tax', label: '源泉徴収', group: '人事・給与', lead: '確定した給与から、源泉徴収簿（月ごとの記録）と源泉徴収票の下書きを作ります。給与を支払った年（1〜12月支給分）で集計します。',
    render(main) {
      const d = S.get(), y = ps.year;
      const bar = UI.el(`<div class="toolbar"></div>`);
      bar.append(UI.stepper(`${y}年（${U.wareki(y)}）`, () => { ps.year--; Admin.refresh(); }, () => { ps.year++; Admin.refresh(); }));
      main.append(bar);
      const payYm = p => U.ymAdd(p.ym, 1);   // 月末締め・翌月払い：支払った年で集計する
      const yrs = d.payrolls.filter(p => payYm(p).startsWith(String(y)));
      main.append(UI.el(`<p class="notice">年末調整はまだ反映していません（試作）。源泉徴収票の「源泉徴収税額」は、毎月預かった所得税の合計です。提出前に税理士または国税庁の資料で確認してください。</p>`));

      const months = [...Array(12)].map((_, i) => `${y}-${U.pad(i + 1)}`);
      const people = d.staff.filter(s => yrs.some(p => p.staffId === s.id));
      main.append(UI.el(`<section class="card"><h2>月別の納付額（全員分）</h2><div class="scroll"><table class="tbl"><thead><tr><th>支給月</th><th class="r">支給人数</th><th class="r">課税支給額</th><th class="r">所得税</th><th>納付期限</th></tr></thead><tbody>${months.map(m => {
        const l = yrs.filter(p => payYm(p) === m); if (!l.length) return '';
        return `<tr><td>${+m.slice(5)}月支給<small class="muted">（${U.ymLabel(U.ymAdd(m, -1))}分）</small></td><td class="r">${l.length}人</td><td class="r mono">${U.yen(U.sum(l, p => p.taxable))}</td><td class="r mono"><b>${U.yen(U.sum(l, p => p.tax))}</b></td><td>${U.label(U.ymAdd(m, 1) + '-10')}</td></tr>`;
      }).join('') || '<tr><td colspan="5" class="muted">この年の確定した給与はありません</td></tr>'}</tbody></table></div><p class="muted small">所得税は「給与を支払った月の翌月10日」までに納めます。月末締め・翌月${d.settings.payDay}日払いなので、たとえば10月分（11月${d.settings.payDay}日支給）は12月10日が期限です。納期の特例を受けている場合は年2回（7/10・1/20）にまとめて納めます。</p></section>`));

      people.forEach(s => {
        const l = yrs.filter(p => p.staffId === s.id).sort((a, b) => a.ym.localeCompare(b.ym));
        const pay = U.sum(l, p => p.taxable), tax = U.sum(l, p => p.tax), soc = U.sum(l, p => p.empIns + p.social);
        const after = Math.max(0, pay - App.Pay.annualKyuyo(pay));
        main.append(UI.el(`<section class="card"><h2><i class="dot" style="background:${s.color}"></i>${U.esc(s.name)} <small class="muted">${s.taxCol}欄 ・ 扶養${s.dependents}人</small></h2>
          <div class="grid-2"><div class="scroll"><table class="tbl"><thead><tr><th>支給月</th><th class="r">課税支給額</th><th class="r">社会保険料等</th><th class="r">所得税</th></tr></thead><tbody>${l.map(p => `<tr><td>${+payYm(p).slice(5)}月支給</td><td class="r mono">${U.yen(p.taxable)}</td><td class="r mono">${U.yen(p.empIns + p.social)}</td><td class="r mono">${U.yen(p.tax)}</td></tr>`).join('')}</tbody>
            <tfoot><tr><td>合計</td><td class="r mono">${U.yen(pay)}</td><td class="r mono">${U.yen(soc)}</td><td class="r mono">${U.yen(tax)}</td></tr></tfoot></table></div>
          <div class="gensen"><div class="gensen-title">${U.wareki(y)}分 給与所得の源泉徴収票（下書き）</div>
            <dl><dt>支払を受ける者</dt><dd>${U.esc(s.name)}</dd><dt>種別</dt><dd>給料・賃金</dd>
            <dt>支払金額</dt><dd class="mono">${U.yen(pay)}</dd><dt>給与所得控除後の金額（概算）</dt><dd class="mono">${U.yen(after)}</dd>
            <dt>社会保険料等の金額</dt><dd class="mono">${U.yen(soc)}</dd><dt>源泉徴収税額</dt><dd class="mono"><b>${U.yen(tax)}</b></dd>
            <dt>支払者</dt><dd>${U.esc(d.settings.storeName)}</dd></dl></div></div></section>`));
      });
    },
  });
})();

</script>
<script>
/* ---- js/admin-mail.js ---- */
/* ミセカン 管理者ページ：メール配信（月1回・本人分だけ）
 * 試作版では実際には送信しません。送信日・宛先・本文の確認と、送信予定の記録までです。
 * 本番では、サーバー（例：Google Apps Script）が決まった日に1人ずつ別々のメールで送ります。
 */
'use strict';
(function () {
  const U = App.U, UI = App.UI, S = App.Store, Admin = App.Admin;
  const Mail = App.Mail = {};
  const ms = { staff: '', date: '' };

  /* 次に送る日（未設定なら null） */
  Mail.nextDate = function (s) {
    const m = s.mail, today = U.today();
    if (m.timing === 'unset' || m.timing === 'confirm') return null;
    const day = m.timing === 'payday' ? s.payDay : m.day;
    const at = ym => `${ym}-${U.pad(Math.min(day, U.monthDays(ym).length))}`;
    const ym = U.ym(today);
    return at(ym) >= today ? at(ym) : at(U.ymAdd(ym, 1));
  };
  Mail.timingLabel = function (s) {
    const m = s.mail;
    return { unset: '未設定（あとで指定）', payday: `毎月の給料日（${s.payDay}日）`, day: `毎月${m.day}日`, confirm: '給与を確定したとき' }[m.timing];
  };

  /* 1人分のメールを作る。送る日を基準に「直近で確定した給与の月」と「翌月のシフト」を入れる */
  Mail.build = function (d, st, sendDate) {
    const s = d.settings, m = s.mail;
    const slip = d.payrolls.filter(p => p.staffId === st.id && p.ym < U.ym(sendDate)).sort((a, b) => b.ym.localeCompare(a.ym))[0];
    const ym = slip ? slip.ym : U.ymAdd(U.ym(sendDate), -1);
    const shiftYm = U.ymAdd(U.ym(sendDate), 1);
    const subject = m.subject.replace(/\{店舗名\}/g, s.storeName).replace(/\{年月\}/g, U.ymLabel(ym));
    const L = [];
    L.push(`${st.name} 様`, '', `いつもありがとうございます。${s.storeName}です。`, `${U.ymLabel(ym)}分の給与明細・勤怠と、${U.ymLabel(shiftYm)}のシフトをお知らせします。`, '');
    if (m.payslip) {
      L.push(`■ 給与明細（${U.ymLabel(ym)}分）`);
      if (!st.consent) L.push('　給与明細は紙でお渡しします（メールでの受け取りに同意をいただいていないため）。');
      else if (!slip) L.push('　まだ確定していません。確定したら従業員ページでご確認いただけます。');
      else {
        L.push(`　計算期間　${U.label(slip.periodStart)}〜${U.label(slip.periodEnd)}　支給日　${U.label(slip.payDate)}`,
          `　時給　${U.yen(slip.wage)}　労働日数　${slip.days}日　労働時間　${U.hm(slip.workMin)}（時間外 ${U.hm(slip.otMin)}・深夜 ${U.hm(slip.nightMin)}）`,
          `　基本給　${U.yen(slip.base)}　時間外手当　${U.yen(slip.otPay)}　深夜手当　${U.yen(slip.nightPay)}　通勤手当　${U.yen(slip.transport)}`,
          `　総支給額　${U.yen(slip.gross)}`,
          `　雇用保険料　${U.yen(slip.empIns)}　社会保険料　${U.yen(slip.social)}　所得税　${U.yen(slip.tax)}　控除合計　${U.yen(slip.deductions)}`,
          `　差引支給額　${U.yen(slip.net)}`);
      }
      L.push('');
    }
    if (m.attendance) {
      L.push(`■ 勤怠（${U.ymLabel(ym)}の打刻）`);
      const ps = d.punches.filter(p => p.staffId === st.id && p.date.startsWith(ym)).sort((a, b) => a.date.localeCompare(b.date));
      ps.forEach(p => { const c = App.Pay.day(p); L.push(`　${U.label(p.date)}　${p.in}〜${p.out || '（退勤の打刻なし）'}　休憩${p.breakMin}分　実働 ${c ? U.hm(c.work) : '−'}`); });
      if (!ps.length) L.push('　この月の打刻はありません。');
      L.push('');
    }
    if (m.shift) {
      L.push(`■ ${U.ymLabel(shiftYm)}のシフト（${U.label(sendDate)}時点で確定している分）`);
      const sh = d.shifts.filter(x => x.staffId === st.id && x.date.startsWith(shiftYm)).sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start));
      sh.forEach(x => L.push(`　${U.label(x.date)}　${U.short(x.start)}〜${U.short(x.end)}`));
      if (!sh.length) L.push('　まだ確定しているシフトはありません。');
      L.push('');
    }
    L.push('――――――――――', `このメールは ${s.storeName} から、ご本人だけにお送りしています。`, '内容に誤りがある場合や、メールでの受け取りをやめたい場合は店長にお知らせください。', '心当たりのない方は、お手数ですが破棄してください。');
    return { to: st.email, subject, body: L.join('\n'), ym, shiftYm };
  };

  Admin.register({
    id: 'mail', label: 'メール配信', group: '人事・給与', lead: '従業員1人ずつに、本人の給与明細・勤怠・翌月のシフトを月1回メールで送る設定です。試作版では実際には送信せず、送信予定の記録までを行います。',
    render(main) {
      const d = S.get(), s = d.settings, m = s.mail, next = Mail.nextDate(s);
      main.append(UI.el(`<p class="notice">試作版：メールは送信されません。「送信予定に記録」を押しても、記録が残るだけです。本番で送るには、サーバー側の仕組み（例：Googleスプレッドシート＋Apps Script）が必要です。</p>`));
      main.append(UI.el(`<section class="tiles">
        <div class="tile"><span class="tile-label">自動送信</span><b class="tile-num">${m.enabled && m.timing !== 'unset' ? 'オン' : 'オフ'}</b><span class="tile-sub">${m.enabled && m.timing === 'unset' ? '送信日が未設定のため止まっています' : '設定で切り替えます'}</span></div>
        <div class="tile"><span class="tile-label">送信のタイミング</span><b class="tile-num small-num">${U.esc(Mail.timingLabel(s))}</b><span class="tile-sub">${next ? `次回 ${U.label(next)}` : m.timing === 'confirm' ? '給与計算タブで確定したとき' : '送信日はあとで指定してください'}</span></div>
        <div class="tile"><span class="tile-label">送る人</span><b class="tile-num">${d.staff.filter(x => x.active && x.email).length}<small> 人</small></b><span class="tile-sub">給与明細つき ${d.staff.filter(x => x.active && x.email && x.consent).length}人</span></div></section>`));

      const cfg = UI.el(`<section class="card input-card" data-input><h2>送信の設定</h2><form class="form">
        <label class="check wide"><input type="checkbox" id="m_enabled" ${m.enabled ? 'checked' : ''}> 月1回の自動送信を使う</label>
        <label class="field">送信のタイミング<select id="m_timing">${U.options([['unset', '未設定（あとで指定）'], ['payday', '毎月の給料日'], ['day', '毎月決まった日'], ['confirm', '給与を確定したとき']], m.timing)}</select></label>
        <label class="field">決まった日（毎月）<input id="m_day" type="number" min="1" max="31" value="${m.day}"></label>
        <label class="field">差出人の名前<input id="m_fromName" value="${U.esc(m.fromName)}"></label>
        <label class="field wide">件名（{店舗名}・{年月} が入れ替わります）<input id="m_subject" value="${U.esc(m.subject)}"></label>
        <label class="check"><input type="checkbox" id="m_payslip" ${m.payslip ? 'checked' : ''}> 給与明細（同意した人だけ）</label>
        <label class="check"><input type="checkbox" id="m_attendance" ${m.attendance ? 'checked' : ''}> その月の勤怠（打刻）</label>
        <label class="check"><input type="checkbox" id="m_shift" ${m.shift ? 'checked' : ''}> 翌月のシフト</label>
        <div class="wide row-end"><button class="btn primary">設定を保存</button></div></form>
        <p class="muted small">メールは1人ずつ別々に送り、ほかの人のアドレスや内容は入りません。給与明細をメールで送れるのは、電子交付に同意した人だけです（所得税法231条2項・同施行令356条）。同意のない人には、給与明細を除いた内容を送り、明細は紙で渡します。</p></section>`);
      cfg.querySelector('form').onsubmit = e => {
        e.preventDefault(); const v = id => cfg.querySelector('#m_' + id);
        m.enabled = v('enabled').checked; m.timing = v('timing').value; m.day = Math.min(31, Math.max(1, Number(v('day').value) || 1));
        m.fromName = v('fromName').value.trim(); m.subject = v('subject').value.trim() || '【{店舗名}】{年月}分 給与明細・勤怠・シフトのお知らせ';
        m.payslip = v('payslip').checked; m.attendance = v('attendance').checked; m.shift = v('shift').checked;
        S.log('管理者', 'メール配信の設定を変更', 'メール配信', `${Mail.timingLabel(s)} / ${m.enabled ? 'オン' : 'オフ'}`);
        S.save(); UI.toast('保存しました'); Admin.refresh();
      };
      main.append(cfg);

      const rec = UI.el(`<section class="card"><h2>送り先</h2><div class="scroll"><table class="tbl"><thead><tr><th>氏名</th><th>メールアドレス</th><th>電子交付の同意</th><th>送る内容</th></tr></thead><tbody>${d.staff.filter(x => x.active).map(x => `<tr><td class="nowrap"><i class="dot" style="background:${x.color}"></i>${U.esc(x.name)}</td><td>${x.email ? U.esc(x.email) : '<span class="chip">未登録</span>'}</td><td>${x.consent ? `<span class="chip good">同意 ${U.esc(x.consentDate)}</span>` : '<span class="chip warn">同意なし</span>'}</td><td>${!x.email ? '<span class="muted">送りません</span>' : [m.payslip ? (x.consent ? '給与明細' : '<s>給与明細</s>（紙）') : '', m.attendance ? '勤怠' : '', m.shift ? 'シフト' : ''].filter(Boolean).join('・')}</td></tr>`).join('')}</tbody></table></div><p class="muted small">アドレスと同意は「従業員名簿」で変えられます。</p></section>`);
      main.append(rec);

      const people = d.staff.filter(x => x.active && x.email);
      if (!people.some(x => x.id === ms.staff)) ms.staff = people[0]?.id || '';
      if (!ms.date) ms.date = next || U.today();
      const st = S.staff(ms.staff);
      const pv = UI.el(`<section class="card"><h2>本文の確認</h2><div class="toolbar"><div class="pills">${people.map(x => `<button class="pill${x.id === ms.staff ? ' on' : ''}" data-s="${x.id}">${U.esc(x.name)}</button>`).join('')}</div><label class="inline">送る日 <input type="date" id="pvDate" value="${ms.date}"></label></div></section>`);
      if (st) {
        const mail = Mail.build(d, st, ms.date);
        pv.append(UI.el(`<div class="mail-pv"><dl><div><dt>差出人</dt><dd>${U.esc(m.fromName)}</dd></div><div><dt>宛先</dt><dd>${U.esc(mail.to)}</dd></div><div><dt>件名</dt><dd>${U.esc(mail.subject)}</dd></div></dl><pre>${U.esc(mail.body)}</pre></div>`));
        const b = UI.el(`<div class="row-end"><button class="btn primary">送信予定に記録（試作：送信しません）</button></div>`);
        b.querySelector('button').onclick = async () => {
          if (!await UI.confirm(`${st.name} さん（${st.email}）あてのメールを、送信予定として記録します。実際には送信されません。`, '記録する')) return;
          d.mailLog.push({ at: new Date().toISOString().slice(0, 19), staffId: st.id, name: st.name, to: st.email, subject: mail.subject, sendDate: ms.date, payslip: m.payslip && st.consent, status: '記録のみ（試作）' });
          S.log('管理者', 'メールを送信予定に記録', st.name, mail.subject);
          S.save(); UI.toast('記録しました'); Admin.refresh();
        };
        pv.append(b);
      } else pv.append(UI.el(`<p class="muted">メールアドレスが登録された従業員がいません。</p>`));
      pv.querySelectorAll('[data-s]').forEach(b => { b.onclick = () => { ms.staff = b.dataset.s; Admin.refresh(); }; });
      pv.querySelector('#pvDate').onchange = e => { if (e.target.value) { ms.date = e.target.value; Admin.refresh(); } };
      main.append(pv);

      main.append(UI.el(`<section class="card"><h2>送信の記録</h2><div class="scroll"><table class="tbl"><thead><tr><th>記録した日時</th><th>送る日</th><th>宛先</th><th>件名</th><th>給与明細</th><th>状態</th></tr></thead><tbody>${d.mailLog.slice().reverse().slice(0, 50).map(l => `<tr><td class="num nowrap">${l.at.replace('T', ' ').slice(0, 16)}</td><td class="nowrap">${U.label(l.sendDate)}</td><td>${U.esc(l.name)}<br><small class="muted">${U.esc(l.to)}</small></td><td>${U.esc(l.subject)}</td><td>${l.payslip ? 'あり' : 'なし'}</td><td><span class="chip">${U.esc(l.status)}</span></td></tr>`).join('') || '<tr><td colspan="6" class="muted">まだ記録はありません</td></tr>'}</tbody></table></div></section>`));
    },
  });
})();

</script>
<script>
/* ---- js/admin-sales.js ---- */
/* ミセカン 管理者ページ：毎日の売上・購買履歴とランキング
 * データの決まり：
 *  - 「売上」＝1日のレジ締めの合計と客数。管理者が「毎日の売上」で入力する（ホームやグラフはここから計算）
 *  - 「購買履歴」＝商品ごとの販売記録。管理者が「購買履歴・ランキング」で入力する（ランキングはここから計算）
 *  - 2つの合計が合わない日は「差」を表示し、明細の合計を売上に入れるボタンを出す
 */
'use strict';
(function () {
  const U = App.U, UI = App.UI, S = App.Store, Admin = App.Admin;
  const ss = { ym: U.ym(U.today()), days: '30', metric: 'amount', q: '', date: '' };
  const man = v => (v / 10000).toLocaleString('ja-JP', { maximumFractionDigits: 1 }) + '万';
  const detailSum = (d, date) => U.sum(d.purchases.filter(p => p.date === date), p => p.price * p.qty);
  const hasDetail = (d, date) => d.purchases.some(p => p.date === date);

  /* ================= 毎日の売上 ================= */
  Admin.register({
    id: 'sales', label: '毎日の売上', group: '売上', lead: '閉店後に、レジ締めの合計金額と客数をここに入力します。ホームの売上・グラフ・人件費率はこの数字から計算します。',
    render(main) {
      const d = S.get(), ym = ss.ym;
      if (!ss.date) ss.date = U.addDays(U.today(), -1);
      const form = UI.el(`<section class="card input-card" data-input><h2>売上を入力・修正</h2><form class="form inline-form">
        <label class="field">日付<input type="date" id="sDate" value="${ss.date}" max="${U.today()}" required></label>
        <label class="field">売上（円・税込み）<input type="number" id="sAmt" min="0" step="1" required inputmode="numeric"></label>
        <label class="field">客数（人）<input type="number" id="sCus" min="0" step="1" inputmode="numeric"></label>
        <label class="field">メモ<input id="sNote" placeholder="例：雨・イベントあり"></label>
        <button class="btn primary">保存</button></form>
        <div class="hint" id="sHint"></div></section>`);
      const fill = () => {
        const date = form.querySelector('#sDate').value; ss.date = date;
        const r = d.sales.find(x => x.date === date), ds = detailSum(d, date);
        form.querySelector('#sAmt').value = r ? r.amount : ''; form.querySelector('#sCus').value = r ? r.customers : ''; form.querySelector('#sNote').value = r ? r.note : '';
        const h = form.querySelector('#sHint');
        h.innerHTML = `${r ? '<span class="chip">入力済み：保存すると上書きします</span>' : '<span class="chip warn">まだ入力していない日です</span>'}
          ${hasDetail(d, date) ? ` <span>この日の購買履歴（商品明細）の合計：<b>${U.yen(ds)}</b></span> <button type="button" class="btn sm" id="useDetail">この金額を売上に入れる</button>` : ' <span class="muted">この日の商品明細はまだありません（「購買履歴・ランキング」で入力）</span>'}`;
        const u = h.querySelector('#useDetail'); if (u) u.onclick = () => { form.querySelector('#sAmt').value = ds; form.querySelector('#sAmt').focus(); };
      };
      form.querySelector('#sDate').onchange = fill; fill();
      form.querySelector('form').onsubmit = e => {
        e.preventDefault();
        const v = id => form.querySelector('#' + id).value, date = v('sDate');
        const rec = { date, amount: Number(v('sAmt')), customers: Number(v('sCus') || 0), note: v('sNote').trim() };
        const i = d.sales.findIndex(x => x.date === date); if (i >= 0) d.sales[i] = rec; else d.sales.push(rec);
        d.sales.sort((a, b) => a.date.localeCompare(b.date)); ss.ym = U.ym(date);
        S.save(); UI.toast(`${U.label(date)}の売上を保存しました`); Admin.refresh();
      };
      main.append(form);

      const bar = UI.el(`<div class="toolbar"></div>`);
      bar.append(UI.stepper(U.ymLabel(ym), () => { ss.ym = U.ymAdd(ym, -1); Admin.refresh(); }, () => { ss.ym = U.ymAdd(ym, 1); Admin.refresh(); }));
      main.append(bar);

      const days = U.monthDays(ym), rec = d.sales.filter(x => x.date.startsWith(ym));
      const total = U.sum(rec, x => x.amount), cus = U.sum(rec, x => x.customers);
      // 前年同月は「同じ日まで」で比べる（今月の途中なのに前年の1か月分と比べると、減ったように見えてしまうため）
      const lastDay = ym === U.ym(U.today()) ? +U.addDays(U.today(), -1).slice(8) : 31;
      const ly = U.sum(d.sales.filter(x => x.date.startsWith(U.ymAdd(ym, -12)) && +x.date.slice(8) <= lastDay), x => x.amount);
      const diff = ly ? (total / ly - 1) * 100 : null;
      const missing = days.filter(x => x < U.today() && !rec.some(r => r.date === x));
      main.append(UI.el(`<section class="tiles">
        <div class="tile"><span class="tile-label">月の売上</span><b class="tile-num">${U.yen(total)}</b><span class="tile-sub">${rec.length}日分入力 ${missing.length ? `<span class="chip warn">未入力 ${missing.length}日</span>` : ''}</span></div>
        <div class="tile"><span class="tile-label">1日平均</span><b class="tile-num">${U.yen(rec.length ? total / rec.length : 0)}</b><span class="tile-sub">客数 ${U.num(cus)}人</span></div>
        <div class="tile"><span class="tile-label">客単価</span><b class="tile-num">${U.yen(cus ? total / cus : 0)}</b><span class="tile-sub">売上÷客数</span></div>
        <div class="tile"><span class="tile-label">前年同月${lastDay < 31 ? `（1〜${lastDay}日）` : ''}</span><b class="tile-num">${ly ? U.yen(ly) : '−'}</b><span class="tile-sub">${diff === null ? 'データなし' : `<span class="chip ${diff >= 0 ? 'good' : 'bad'}">${diff >= 0 ? '▲' : '▼'} ${Math.abs(diff).toFixed(1)}%</span>`}</span></div></section>`));

      const c1 = UI.el(`<section class="card"><h2>日別の売上 <small class="muted">${U.ymLabel(ym)}・棒を押すとその日を入力欄に読み込みます</small></h2></section>`);
      c1.append(App.Chart.bars(days.map(x => { const r = rec.find(y => y.date === x); return { date: x, label: String(+x.slice(8)), cls: U.wdClass(x), tip: U.label(x), value: r ? r.amount : 0, sub: r ? `客数 ${r.customers}人${r.note ? ' ・ ' + r.note : ''}` : '未入力' }; }),
        { fmt: U.yen, fmtAxis: man, maxLabels: 31, label: '日別の売上', onClick: x => { ss.date = x.date; Admin.refresh(); } }));
      main.append(c1);

      const months = []; for (let i = 11; i >= 0; i--) months.push(U.ymAdd(ym, -i));
      const c2 = UI.el(`<section class="card"><h2>月別の売上 <small class="muted">棒を押すとその月を表示</small></h2></section>`);
      c2.append(App.Chart.bars(months.map(m => ({ m, label: `${+m.slice(5)}月`, tip: U.ymLabel(m), hl: m === ym, value: U.sum(d.sales.filter(x => x.date.startsWith(m)), x => x.amount) })), { fmt: U.yen, fmtAxis: man, label: '月別の売上', onClick: x => { ss.ym = x.m; Admin.refresh(); } }));
      main.append(c2);

      const tbl = UI.el(`<section class="card"><h2>入力の一覧 <small class="muted">${U.ymLabel(ym)}</small></h2><div class="scroll"><table class="tbl"><thead><tr><th>日付</th><th class="r">売上</th><th class="r">客数</th><th class="r">客単価</th><th class="r">商品明細の合計</th><th class="r">差</th><th>メモ</th><th></th></tr></thead><tbody>${days.filter(x => x <= U.today()).reverse().map(x => {
        const r = rec.find(y => y.date === x), ds = hasDetail(d, x) ? detailSum(d, x) : null;
        if (!r) return `<tr class="missing"><td class="${U.wdClass(x)}">${U.label(x)}</td><td colspan="6"><span class="chip warn">未入力</span></td><td><button class="btn sm primary" data-edit="${x}">入力</button></td></tr>`;
        const gap = ds === null ? null : r.amount - ds;
        return `<tr><td class="${U.wdClass(x)}">${U.label(x)}</td><td class="r num">${U.yen(r.amount)}</td><td class="r">${r.customers}</td><td class="r num">${U.yen(r.customers ? r.amount / r.customers : 0)}</td>
          <td class="r num">${ds === null ? '<span class="muted">明細なし</span>' : U.yen(ds)}</td><td class="r num">${gap === null ? '−' : gap === 0 ? '<span class="chip good">一致</span>' : `<span class="chip warn">${gap > 0 ? '+' : ''}${U.num(gap)}</span>`}</td>
          <td>${U.esc(r.note)}</td><td class="nowrap"><button class="btn sm" data-edit="${x}">修正</button> <button class="btn sm danger" data-del="${x}">削除</button></td></tr>`;
      }).join('')}</tbody></table></div><p class="muted small">「差」は売上（レジ締め）と商品明細の合計の差です。明細を入力していない商品があると差が出ます。</p></section>`);
      tbl.onclick = async e => {
        const t = e.target;
        if (t.dataset.edit) { ss.date = t.dataset.edit; Admin.refresh(); setTimeout(() => { const f = document.querySelector('[data-input]'); f && f.scrollIntoView({ behavior: 'smooth' }); document.getElementById('sAmt')?.focus({ preventScroll: true }); }, 50); }
        if (t.dataset.del) {
          if (!await UI.confirm(`${U.label(t.dataset.del)}の売上を削除します。`, '削除する', true)) return;
          d.sales = d.sales.filter(x => x.date !== t.dataset.del); S.log('管理者', '売上を削除', U.label(t.dataset.del), ''); S.save(); UI.toast('削除しました'); Admin.refresh();
        }
      };
      main.append(tbl);
    },
  });

  /* ================= 購買履歴・ランキング ================= */
  function itemModal(it) {
    const d = S.get(), isNew = !it.id;
    UI.modal(isNew ? '商品を追加' : '商品を変更', `<form class="form">
      <label class="field wide">商品名<input id="i_name" value="${U.esc(it.name || '')}" required></label>
      <label class="field">カテゴリ<input id="i_cat" value="${U.esc(it.category || '')}" list="catList2" required><datalist id="catList2">${[...new Set(d.items.map(x => x.category))].map(c => `<option value="${U.esc(c)}">`).join('')}</datalist></label>
      <label class="field">単価（円・税込み）<input id="i_price" type="number" min="0" value="${it.price ?? ''}" required></label>
      <p class="wide muted small">単価を変えても、すでに記録した販売の金額は変わりません（記録したときの単価のまま残ります）。</p><p class="wide err" id="i_err"></p></form>`,
    [...(isNew ? [] : [{ label: '削除', kind: 'danger', onClick: () => { d.items = d.items.filter(x => x.id !== it.id); S.save(); UI.toast('商品マスタから削除しました（過去の記録は残ります）'); Admin.refresh(); } }]),
      { label: 'やめる' },
      { label: '保存する', kind: 'primary', onClick: w => {
        const f = w.querySelector('form'); if (!f.reportValidity()) return false;
        const name = w.querySelector('#i_name').value.trim();
        if (d.items.some(x => x.name === name && x.id !== it.id)) { w.querySelector('#i_err').textContent = '同じ名前の商品があります。'; return false; }
        const n = { name, category: w.querySelector('#i_cat').value.trim(), price: Number(w.querySelector('#i_price').value) };
        if (isNew) d.items.push(Object.assign({ id: 'it' + U.uid() }, n)); else Object.assign(it, n);
        S.save(); UI.toast('商品マスタを保存しました'); Admin.refresh();
      } }]);
  }

  Admin.register({
    id: 'purchases', label: '購買履歴・ランキング', group: '売上', lead: '商品ごとに「何がいくつ売れたか」を記録し、ランキングを出します。1日の売上の合計は「毎日の売上」で入力します。',
    render(main) {
      const d = S.get(), today = U.today();
      const from = ss.days === 'all' ? '0000' : U.addDays(today, -Number(ss.days));
      const list = d.purchases.filter(p => p.date >= from);

      // 入力欄（いちばん上）
      const add = UI.el(`<section class="card input-card" data-input><h2>販売を記録する</h2><form class="form inline-form">
        <label class="field">日付<input type="date" id="bDate" value="${today}" max="${today}" required></label>
        <label class="field">時刻（1日分の集計なら空欄）<input type="time" id="bTime"></label>
        <label class="field">商品（商品マスタから選ぶ）<select id="bItem" required><option value="">選んでください</option>${d.items.map(x => `<option value="${x.id}">${U.esc(x.name)}（${U.yen(x.price)}）</option>`).join('')}</select></label>
        <label class="field">数量<input type="number" id="bQty" min="1" value="1" required></label>
        <label class="field">会員番号（任意）<input id="bCus" placeholder="例：会員0012"></label>
        <button class="btn primary">記録</button></form>
        <p class="muted small">商品マスタにない商品は、下の「商品マスタ」で先に追加してください。記録した金額は「毎日の売上」の「商品明細の合計」に反映されます。</p></section>`);
      add.querySelector('form').onsubmit = e => {
        e.preventDefault(); const v = id => add.querySelector('#' + id).value;
        const it = d.items.find(x => x.id === v('bItem')); if (!it) return;
        d.purchases.push({ id: U.uid(), date: v('bDate'), time: v('bTime'), itemId: it.id, item: it.name, category: it.category, price: it.price, qty: Number(v('bQty')), customer: v('bCus').trim() });
        S.save(); UI.toast(`${it.name}×${v('bQty')} を記録しました`); Admin.refresh();
      };
      main.append(add);

      const bar = UI.el(`<div class="toolbar"><div class="seg">${[['7', '7日'], ['30', '30日'], ['90', '90日'], ['all', 'すべて']].map(([v, l]) => `<button data-days="${v}" aria-selected="${ss.days === v}">${l}</button>`).join('')}</div>
        <div class="seg">${[['amount', '金額'], ['qty', '数量']].map(([v, l]) => `<button data-m="${v}" aria-selected="${ss.metric === v}">${l}で並べる</button>`).join('')}</div></div>`);
      bar.querySelectorAll('[data-days]').forEach(b => { b.onclick = () => { ss.days = b.dataset.days; Admin.refresh(); }; });
      bar.querySelectorAll('[data-m]').forEach(b => { b.onclick = () => { ss.metric = b.dataset.m; Admin.refresh(); }; });
      main.append(bar);

      const val = p => ss.metric === 'qty' ? p.qty : p.qty * p.price;
      const fmt = ss.metric === 'qty' ? (v => U.num(v) + '個') : U.yen;
      const group = (key, n) => {
        const m = {}; list.forEach(p => { const k = key(p); if (!k) return; m[k] = m[k] || { label: k, value: 0, qty: 0, amt: 0 }; m[k].value += val(p); m[k].qty += p.qty; m[k].amt += p.qty * p.price; });
        return Object.values(m).sort((a, b) => b.value - a.value).slice(0, n).map(r => Object.assign(r, { sub: ss.metric === 'qty' ? U.yen(r.amt) : r.qty + '個' }));
      };
      const salesSum = U.sum(d.sales.filter(x => x.date >= from), x => x.amount);
      main.append(UI.el(`<section class="tiles">
        <div class="tile"><span class="tile-label">売れた数</span><b class="tile-num">${U.num(U.sum(list, p => p.qty))}個</b><span class="tile-sub">${list.length}件の記録</span></div>
        <div class="tile"><span class="tile-label">明細の金額の合計</span><b class="tile-num">${U.yen(U.sum(list, p => p.qty * p.price))}</b><span class="tile-sub">同じ期間の売上（レジ締め）${U.yen(salesSum)}</span></div>
        <div class="tile"><span class="tile-label">会員の購入</span><b class="tile-num">${list.filter(p => p.customer).length}件</b><span class="tile-sub">${ss.days === 'all' ? 'すべての期間' : `直近${ss.days}日`}</span></div></section>`));
      const grid = UI.el(`<div class="grid-2"></div>`);
      const c1 = UI.el(`<section class="card"><h2>商品ランキング</h2></section>`); c1.append(App.Chart.ranking(group(p => p.item, 10), fmt));
      const right = UI.el(`<div class="stack"></div>`);
      const c2 = UI.el(`<section class="card"><h2>カテゴリ別</h2></section>`); c2.append(App.Chart.ranking(group(p => p.category, 6), fmt));
      const c3 = UI.el(`<section class="card"><h2>会員ランキング</h2></section>`); c3.append(App.Chart.ranking(group(p => p.customer, 5), fmt));
      right.append(c2, c3); grid.append(c1, right); main.append(grid);

      // 商品マスタ
      const master = UI.el(`<section class="card"><div class="card-head"><h2>商品マスタ</h2><button class="btn sm primary" id="itAdd">＋ 商品を追加</button></div><div class="scroll"><table class="tbl hover"><thead><tr><th>商品名</th><th>カテゴリ</th><th class="r">単価</th><th class="r">記録の件数</th></tr></thead><tbody>${d.items.map(x => `<tr data-it="${x.id}" tabindex="0"><td>${U.esc(x.name)}</td><td><span class="chip">${U.esc(x.category)}</span></td><td class="r num">${U.yen(x.price)}</td><td class="r">${d.purchases.filter(p => p.itemId === x.id).length}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">商品がありません</td></tr>'}</tbody></table></div><p class="muted small">行を押すと変更・削除できます。</p></section>`);
      master.querySelector('#itAdd').onclick = () => itemModal({});
      master.querySelectorAll('tr[data-it]').forEach(tr => { const o = () => itemModal(d.items.find(x => x.id === tr.dataset.it)); tr.onclick = o; tr.onkeydown = e => { if (e.key === 'Enter') o(); }; });
      main.append(master);

      const q = ss.q.trim();
      const hist = list.filter(p => !q || (p.item + p.category + p.customer).includes(q)).sort((a, b) => (b.date + (b.time || '99')).localeCompare(a.date + (a.time || '99')));
      const h = UI.el(`<section class="card"><div class="card-head"><h2>購買履歴</h2><input type="search" id="bQ" placeholder="商品・カテゴリ・会員で絞り込み" value="${U.esc(ss.q)}" aria-label="絞り込み"></div><div class="scroll"><table class="tbl"><thead><tr><th>日付</th><th>時刻</th><th>商品</th><th>カテゴリ</th><th class="r">単価</th><th class="r">数量</th><th class="r">金額</th><th>会員</th><th></th></tr></thead><tbody>${hist.slice(0, 80).map(p => `<tr><td class="nowrap ${U.wdClass(p.date)}">${U.label(p.date)}</td><td class="num">${p.time || '<span class="muted small">1日分の集計</span>'}</td><td>${U.esc(p.item)}</td><td><span class="chip">${U.esc(p.category)}</span></td><td class="r num">${U.yen(p.price)}</td><td class="r">${p.qty}</td><td class="r num">${U.yen(p.price * p.qty)}</td><td>${U.esc(p.customer) || '<span class="muted">−</span>'}</td><td><button class="btn sm danger" data-del="${p.id}">削除</button></td></tr>`).join('') || '<tr><td colspan="9" class="muted">該当する記録はありません</td></tr>'}</tbody></table></div><p class="muted small">${hist.length}件中、新しい順に${Math.min(80, hist.length)}件を表示</p></section>`);
      h.querySelector('#bQ').onchange = e => { ss.q = e.target.value; Admin.refresh(); };
      h.onclick = async e => {
        const id = e.target.dataset.del; if (!id) return;
        const p = d.purchases.find(x => x.id === id);
        if (!await UI.confirm(`${U.label(p.date)} ${p.item}×${p.qty} の記録を削除します。`, '削除する', true)) return;
        d.purchases = d.purchases.filter(x => x.id !== id); S.save(); UI.toast('削除しました'); Admin.refresh();
      };
      main.append(h);
    },
  });
})();

</script>
<script>
/* ---- js/admin-main.js ---- */
/* ミセカン 管理者ページの起動（暗証番号の確認とタブの切り替え） */
'use strict';
(function () {
  const S = App.Store;
  const KEY = 'misekan.adminOpen';
  const isOpen = () => { try { return sessionStorage.getItem(KEY) === '1'; } catch (e) { return false; } };
  const setOpen = v => { try { v ? sessionStorage.setItem(KEY, '1') : sessionStorage.removeItem(KEY); } catch (e) {} };
  let open = isOpen();

  function route() {
    document.getElementById('storeName').textContent = S.get().settings.storeName;
    document.getElementById('gate').hidden = open;
    document.getElementById('adminView').hidden = !open;
    document.getElementById('lock').hidden = !open;
    if (!open) { setTimeout(() => document.getElementById('gatePin').focus(), 0); return; }
    App.Admin.show(location.hash.slice(1) || 'dashboard');
    window.scrollTo(0, 0);
  }
  document.getElementById('gateForm').onsubmit = e => {
    e.preventDefault();
    const pin = document.getElementById('gatePin').value, err = document.getElementById('gateErr');
    const lock = App.Guard.locked('admin');
    if (lock) { err.textContent = `打ち間違いが続いたため、あと${lock}分ほど入れません。`; return; }
    if (String(pin) !== String(S.get().settings.adminPin)) {
      const l = App.Guard.fail('admin');
      err.textContent = l ? `打ち間違いが${App.Guard.MAX}回続いたため、${l}分間ロックしました。` : '暗証番号が違います。';
      document.getElementById('gatePin').value = ''; return;
    }
    App.Guard.ok('admin');
    open = true; setOpen(true); document.getElementById('gatePin').value = ''; document.getElementById('gateErr').textContent = ''; route();
  };
  document.getElementById('lock').onclick = () => { open = false; setOpen(false); route(); };
  addEventListener('hashchange', route);
  // 15分なにも操作しなければ自動でロック（席を離れたときの のぞき見対策）
  App.idle(15, () => { if (open) { open = false; setOpen(false); route(); document.getElementById('gateErr').textContent = '15分操作がなかったため、ロックしました。'; } });
  route();
})();

</script>
</body>
</html>
