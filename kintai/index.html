<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ミセカン 店舗管理</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo" aria-hidden="true">ミ</span><b>ミセカン</b><span class="store" id="storeName"></span></div>
  <div class="mode" role="tablist" aria-label="画面の切り替え">
    <a href="#dashboard" id="modeAdmin" role="tab">管理画面</a>
    <a href="#app" id="modeApp" role="tab">従業員アプリ</a>
  </div>
</header>
<div class="proto-note">試作版：データはこの端末のブラウザにだけ保存されます。表示している人・金額はすべて見本です。</div>

<div id="adminView" class="admin">
  <nav id="sideNav" class="side" aria-label="管理メニュー"></nav>
  <main id="adminMain" class="admin-main"></main>
</div>

<div id="appView" class="appwrap" hidden>
  <div class="phone-side">
    <h2>従業員のスマホ画面</h2>
    <p>従業員は名前とPINでログインします。届くのは本人のシフト・打刻・給与だけで、ほかの人の時給や給与は見えません。</p>
    <p>ここで打刻やシフト希望を出すと、左上の「管理画面」の勤怠・シフトにすぐ反映されます。</p>
  </div>
  <div class="phone"><div id="appScreen" class="phone-screen"></div></div>
</div>

<div id="tooltip" class="tooltip" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="js/core.js"></script>
<script src="js/payroll.js"></script>
<script src="js/seed.js"></script>
<script src="js/api.js"></script>
<script src="js/admin.js"></script>
<script src="js/admin-shift.js"></script>
<script src="js/admin-pay.js"></script>
<script src="js/admin-sales.js"></script>
<script src="js/staff.js"></script>
<script src="js/main.js"></script>
</body>
</html>
