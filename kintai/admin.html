<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ミセカン 管理者ページ</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Cormorant+Garamond:wght@500;600&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="admin-page">
<header class="topbar">
  <div class="brand"><span class="logo" aria-hidden="true">M</span><span class="brand-text"><b>MISEKAN</b><small>管理者ページ</small></span><span class="store" id="storeName"></span></div>
  <div class="top-r"><a class="top-link" href="staff.html" target="_blank" rel="noopener">従業員ページを開く</a><button class="top-link" id="lock" type="button">ロック</button></div>
</header>
<div class="proto-note">試作版：データはこの端末のブラウザにだけ保存されます。表示している人・金額はすべて見本です。メールは送信されません。</div>

<div id="gate" class="gate" hidden>
  <form id="gateForm" class="gate-card">
    <span class="logo big" aria-hidden="true">M</span>
    <h1>管理者ページ</h1>
    <p class="muted">店長専用です。管理者のPINを入力してください。</p>
    <label class="field">管理者のPIN<input id="gatePin" type="password" inputmode="numeric" autocomplete="off" required></label>
    <p class="err" id="gateErr" role="alert"></p>
    <button class="btn primary block">ひらく</button>
    <p class="muted small">見本のPIN：0000（「設定・データ」で変えられます）</p>
  </form>
</div>

<div id="adminView" class="admin" hidden>
  <nav id="sideNav" class="side" aria-label="管理メニュー"></nav>
  <main id="adminMain" class="admin-main"></main>
</div>

<div id="tooltip" class="tooltip" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="js/core.js"></script>
<script src="js/payroll.js"></script>
<script src="js/seed.js"></script>
<script src="js/payslip.js"></script>
<script src="js/admin.js"></script>
<script src="js/admin-legal.js"></script>
<script src="js/admin-shift.js"></script>
<script src="js/admin-pay.js"></script>
<script src="js/admin-mail.js"></script>
<script src="js/admin-sales.js"></script>
<script src="js/admin-main.js"></script>
</body>
</html>
