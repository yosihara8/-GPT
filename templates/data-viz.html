<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>データ可視化テンプレート</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #0d1117;
    font-family: 'Noto Sans JP', sans-serif;
    color: white;
  }

  /* ─── 背景 ─── */
  #bg {
    position: absolute;
    inset: 0;
    background: #0d1117;
  }

  #bg-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(48, 54, 61, 0.5) 1px, transparent 1px),
      linear-gradient(90deg, rgba(48, 54, 61, 0.5) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  /* ─── ヘッダー ─── */
  #header {
    position: absolute;
    top: 50px;
    left: 80px;
    right: 80px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    opacity: 0;
  }

  #report-title {
    font-size: 28px;
    font-weight: 700;
    color: rgba(255,255,255,0.9);
  }

  #report-period {
    font-family: 'DM Mono', monospace;
    font-size: 18px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.1em;
  }

  #live-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 20px;
    background: rgba(34, 197, 94, 0.15);
    border: 1px solid rgba(34, 197, 94, 0.3);
    border-radius: 100px;
    font-size: 16px;
    color: #4ade80;
  }

  #live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #4ade80;
  }

  /* ─── KPIカード ─── */
  #kpi-row {
    position: absolute;
    top: 130px;
    left: 80px;
    right: 80px;
    display: flex;
    gap: 30px;
    opacity: 0;
  }

  .kpi-card {
    flex: 1;
    padding: 30px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
  }

  .kpi-label {
    font-size: 14px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .kpi-value {
    font-size: 44px;
    font-weight: 900;
    font-family: 'DM Mono', monospace;
  }

  .kpi-change {
    margin-top: 8px;
    font-size: 16px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .up { color: #4ade80; }
  .down { color: #f87171; }

  /* ─── メインチャートエリア ─── */
  #chart-area {
    position: absolute;
    bottom: 60px;
    left: 80px;
    right: 500px;
    height: 480px;
    opacity: 0;
  }

  #chart-title {
    font-size: 18px;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.1em;
    margin-bottom: 20px;
  }

  #chart-container {
    position: relative;
    height: 400px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    border-left: 1px solid rgba(255,255,255,0.1);
  }

  /* Y軸ライン */
  .y-line {
    position: absolute;
    left: 0;
    right: 0;
    height: 1px;
    background: rgba(255,255,255,0.05);
  }

  .y-label {
    position: absolute;
    left: -50px;
    font-size: 12px;
    color: rgba(255,255,255,0.3);
    font-family: 'DM Mono', monospace;
    transform: translateY(-50%);
  }

  /* バー */
  .bar-group {
    position: absolute;
    bottom: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    gap: 6px;
    width: 100px;
  }

  .bar {
    width: 70px;
    border-radius: 6px 6px 0 0;
    transform-origin: bottom;
    transform: scaleY(0);
    position: relative;
  }

  .bar-value {
    position: absolute;
    top: -28px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    font-family: 'DM Mono', monospace;
    color: rgba(255,255,255,0.7);
    white-space: nowrap;
    opacity: 0;
  }

  .bar-label {
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    margin-top: 10px;
    position: absolute;
    bottom: -30px;
    white-space: nowrap;
  }

  /* ─── 右サイドパネル ─── */
  #side-panel {
    position: absolute;
    bottom: 60px;
    right: 80px;
    width: 380px;
    height: 480px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    opacity: 0;
  }

  #donut-area {
    flex: 1;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  #donut-title {
    font-size: 14px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }

  .legend-color {
    width: 12px;
    height: 12px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  .legend-name {
    flex: 1;
    font-size: 15px;
    color: rgba(255,255,255,0.7);
  }

  .legend-pct {
    font-family: 'DM Mono', monospace;
    font-size: 16px;
    font-weight: 500;
  }
</style>
</head>
<body>

<div id="stage"
     data-composition-id="data-viz"
     data-start="0"
     data-width="1920"
     data-height="1080">

  <!-- 背景 -->
  <div id="bg" data-start="0" data-duration="20">
    <div id="bg-grid"></div>
  </div>

  <!-- ヘッダー -->
  <div id="header" data-start="0.2" data-duration="19.8">
    <div id="report-title">📊 月次売上レポート — 2025年Q1</div>
    <div id="report-period">Jan — Mar 2025</div>
    <div id="live-badge">
      <div id="live-dot"></div>
      LIVE DATA
    </div>
  </div>

  <!-- KPIカード -->
  <div id="kpi-row" data-start="0.5" data-duration="19.5">
    <div class="kpi-card">
      <div class="kpi-label">総売上</div>
      <div class="kpi-value" id="kv1" style="color:#60a5fa">¥0</div>
      <div class="kpi-change up">▲ 23.4% 前期比</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">新規顧客</div>
      <div class="kpi-value" id="kv2" style="color:#a78bfa">0</div>
      <div class="kpi-change up">▲ 15.2% 前月比</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">平均単価</div>
      <div class="kpi-value" id="kv3" style="color:#34d399">¥0</div>
      <div class="kpi-change up">▲ 8.7% 前期比</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">目標達成率</div>
      <div class="kpi-value" id="kv4" style="color:#fb923c">0%</div>
      <div class="kpi-change down">▼ 2.1% 計画比</div>
    </div>
  </div>

  <!-- メインチャート -->
  <div id="chart-area" data-start="1" data-duration="19">
    <div id="chart-title">MONTHLY REVENUE (百万円)</div>
    <div id="chart-container">

      <!-- Y軸ライン -->
      <div class="y-line" style="bottom:0%"><span class="y-label">0</span></div>
      <div class="y-line" style="bottom:25%"><span class="y-label">25</span></div>
      <div class="y-line" style="bottom:50%"><span class="y-label">50</span></div>
      <div class="y-line" style="bottom:75%"><span class="y-label">75</span></div>
      <div class="y-line" style="bottom:100%"><span class="y-label">100</span></div>

      <!-- バー（月別） -->
      <div class="bar-group" style="left: 80px">
        <div class="bar" id="bar1" style="height:200px;background:linear-gradient(180deg,#3b82f6,#1d4ed8)">
          <div class="bar-value">50M</div>
        </div>
        <div class="bar-label">1月</div>
      </div>
      <div class="bar-group" style="left: 220px">
        <div class="bar" id="bar2" style="height:260px;background:linear-gradient(180deg,#6366f1,#4338ca)">
          <div class="bar-value">65M</div>
        </div>
        <div class="bar-label">2月</div>
      </div>
      <div class="bar-group" style="left: 360px">
        <div class="bar" id="bar3" style="height:300px;background:linear-gradient(180deg,#8b5cf6,#6d28d9)">
          <div class="bar-value">75M</div>
        </div>
        <div class="bar-label">3月</div>
      </div>
      <div class="bar-group" style="left: 500px">
        <div class="bar" id="bar4" style="height:240px;background:linear-gradient(180deg,#60a5fa,#2563eb)">
          <div class="bar-value">60M</div>
        </div>
        <div class="bar-label">4月</div>
      </div>
      <div class="bar-group" style="left: 640px">
        <div class="bar" id="bar5" style="height:320px;background:linear-gradient(180deg,#34d399,#059669)">
          <div class="bar-value">80M</div>
        </div>
        <div class="bar-label">5月</div>
      </div>
      <div class="bar-group" style="left: 780px">
        <div class="bar" id="bar6" style="height:380px;background:linear-gradient(180deg,#fb923c,#ea580c)">
          <div class="bar-value">95M</div>
        </div>
        <div class="bar-label">6月</div>
      </div>
      <div class="bar-group" style="left: 920px">
        <div class="bar" id="bar7" style="height:360px;background:linear-gradient(180deg,#f472b6,#be185d)">
          <div class="bar-value">90M</div>
        </div>
        <div class="bar-label">7月</div>
      </div>
      <div class="bar-group" style="left: 1060px">
        <div class="bar" id="bar8" style="height:400px;background:linear-gradient(180deg,#facc15,#b45309)">
          <div class="bar-value">100M</div>
        </div>
        <div class="bar-label">8月</div>
      </div>

    </div>
  </div>

  <!-- 右サイドパネル -->
  <div id="side-panel" data-start="1.5" data-duration="18.5">
    <div id="donut-area">
      <div id="donut-title">SALES BY CATEGORY</div>
      <div class="legend-item">
        <div class="legend-color" style="background:#60a5fa"></div>
        <div class="legend-name">デジタル製品</div>
        <div class="legend-pct" style="color:#60a5fa">42%</div>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background:#a78bfa"></div>
        <div class="legend-name">サービス</div>
        <div class="legend-pct" style="color:#a78bfa">28%</div>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background:#34d399"></div>
        <div class="legend-name">フィジカル</div>
        <div class="legend-pct" style="color:#34d399">18%</div>
      </div>
      <div class="legend-item" style="border:none">
        <div class="legend-color" style="background:#fb923c"></div>
        <div class="legend-name">その他</div>
        <div class="legend-pct" style="color:#fb923c">12%</div>
      </div>
    </div>
  </div>

</div>

<script>
const tl = gsap.timeline({ paused: true });

// ヘッダー
tl.to("#header", { opacity: 1, duration: 0.5 }, 0.2);
tl.from("#header", { y: -20, duration: 0.5, ease: "power2.out" }, 0.2);

// ライブドットがパルス
tl.to("#live-dot", {
  scale: 1.5,
  opacity: 0.5,
  duration: 0.6,
  repeat: -1,
  yoyo: true,
  ease: "sine.inOut"
}, 1);

// KPIカード
tl.to("#kpi-row", { opacity: 1, duration: 0.1 }, 0.5);
tl.from(".kpi-card", {
  opacity: 0,
  y: 30,
  stagger: 0.1,
  duration: 0.5,
  ease: "power2.out"
}, 0.5);

// KPI数値カウントアップ
const countUpKPI = (id, target, prefix, suffix, start) => {
  tl.to({}, {
    duration: 1.5,
    onUpdate: function() {
      const val = Math.floor(this.progress() * target);
      document.getElementById(id).textContent =
        prefix + val.toLocaleString() + suffix;
    }
  }, start);
};

countUpKPI("kv1", 615, "¥", "M", 1);
countUpKPI("kv2", 1240, "", "", 1.1);
countUpKPI("kv3", 48500, "¥", "", 1.2);
countUpKPI("kv4", 94, "", "%", 1.3);

// チャートエリア
tl.to("#chart-area", { opacity: 1, duration: 0.3 }, 1);

// バーが下から伸びる（stagger）
tl.to(["#bar1","#bar2","#bar3","#bar4","#bar5","#bar6","#bar7","#bar8"], {
  scaleY: 1,
  stagger: 0.12,
  duration: 0.8,
  ease: "back.out(1.2)"
}, 1.2);

// バーの値ラベルがフェードイン
tl.to(".bar-value", {
  opacity: 1,
  stagger: 0.12,
  duration: 0.3
}, 2);

// 右パネル
tl.to("#side-panel", { opacity: 1, duration: 0.5, ease: "power2.out" }, 1.5);
tl.from("#side-panel", { x: 40, duration: 0.5, ease: "power2.out" }, 1.5);
tl.from(".legend-item", {
  opacity: 0,
  x: 20,
  stagger: 0.15,
  duration: 0.4,
  ease: "power2.out"
}, 2);

window.__timelines = window.__timelines || {};
window.__timelines["data-viz"] = tl;
</script>
</body>
</html>
